# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The admin's JSON API (D14, D44). internal/admin serves it, and a test there
# checks that this document describes the same operations.
openapi: 3.1.0
info:
  title: Overscan admin API
  version: "1"
  description: |
    The JSON API of Overscan's admin, under `/api/admin/v1/`. The admin's
    pages work through the same services, so a script can do what the pages
    do.

    **Sessions.** Sign in with `POST /session`. The answer sets the
    `overscan_admin` cookie, which every later request sends, and gives the
    session's CSRF token, which every request that changes something sends
    in the `X-CSRF-Token` header. The pages share these sessions. A session
    ends after a week without use, a month after signing in, when it signs
    out, or when the administrator's password changes. The password is set
    on the server with `overscan admin password`.

    **Bodies.** Requests and answers are JSON in UTF-8. A request body is at
    most 64 KiB, or 1 MiB for the lists of categories that a source brings
    and that a group takes, sent as `Content-Type: application/json`. No
    answer may be cached.

    **Errors.** An error has an HTTP error status and a body of the form
    `{"error": "code", "message": "A sentence."}`: the code is for scripts,
    the message for people.

    **Other origins.** A request from a browser that would change something
    and comes from another origin is refused with 403, whatever its cookies.

    **Secrets.** A source's address can hold the credentials of an account,
    and so can a guide's. The API takes them, keeps them encrypted, and
    never sends them back; a source and a guide show only their `host`
    (D46, D139).
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: /api/admin/v1
security:
  - session: []
tags:
  - name: session
    description: Signing in and out.
  - name: server
    description: The server itself.
  - name: lineup
    description: >-
      A lineup (D45, D47): its groups and channels, as devices see them, and
      the administrator's edits, which refreshes leave alone. Every path
      below `lineup` reads or changes the household account's lineup, or
      the one that its `lineup` parameter names (D106).
      Each category of a source goes to a group; a group can be renamed,
      hidden, merged into another or numbered from a starting number. A
      channel can be renamed, moved to another group, hidden or shown on its
      own, and given a number, which is then pinned: renumbering never moves
      it and no other channel takes it. Groups and channels can be locked:
      once the household has a parental PIN, Overscan's page asks for it
      before it plays them, and Stalker clients do not see them (D55). A
      channel's stream can be set to go through ffmpeg, which rebuilds its
      timestamps (D57). A lineup's rules (D107) show, hide, rename, regroup,
      number or give a logo to the channels that they match, give them
      another channel's guide or move their guide's times (D108), in order,
      after every refresh; the administrator's own edits of a channel win
      over them.
  - name: lineups
    description: >-
      The lineups (D106). Each account sees one. A new one starts as a copy
      of another, with its groups, numbers and edits, and then has its own;
      a source's new channels join every lineup.
  - name: library
    description: >-
      The films and series that devices see (D79): their shelves, which the
      administrator can hide, rename and put in an order of their own, and
      their titles, which can be hidden. A shelf merges the categories of the
      same name from every source, but a Stalker portal's category is a shelf
      of its own (D77). A hidden shelf hides every title on it; a hidden title
      is hidden on every shelf, in search and in Recently Added. The settings
      outlast the reads of the sources. Paths name the kind as `movies` or
      `series`.
  - name: sources
    description: Where channels come from.
  - name: guides
    description: >-
      Guides of the household's own (D139): XMLTV guides at an address, or
      in a file on the server, that fill the channels whose own sources
      give them no programme, matched by guide ID and then by name.
  - name: streams
    description: What is playing now, through the stream hub.
  - name: health
    description: >-
      Channels whose streams failed to start the last time that they were
      played, and what each channel's stream held when it last played, as
      the hub saw it pass (D138). Overscan never opens a channel to test it.
  - name: capture
    description: >-
      Requests from boxes and clients that Overscan does not support yet
      (D13), counted by kind, each with its last example, redacted.
  - name: devices
    description: >-
      The boxes and players that use Overscan (D23). A new one waits until the
      administrator approves it: a box running Overscan's page by the
      six-digit code it shows (D39), a Stalker client by its MAC address.
  - name: accounts
    description: >-
      Who uses Overscan (D102). A household starts with one account; more
      can be added, each with its devices and profiles, its end date,
      parental PIN and theme, a limit on its streams at once, and a login
      and a playlist token for the outputs that players other than the
      boxes use.
  - name: themes
    description: >-
      How the boxes that run Overscan's page look (D97). A theme is a small
      JSON file of named values, which Overscan checks before it installs
      it; the theme guide in Overscan's docs says what one holds. The
      household may have a theme, and a profile one of its own; a box shows
      its profile's, else the household's, else Overscan's own.
  - name: messages
    description: >-
      Short messages to the boxes that run Overscan's page, of every
      account (D96, D111). A box shows a message the next time it checks, within five
      minutes, until someone closes it, and says when it was read. A box
      that has not shown it within a week never does. Stalker clients get
      none.
  - name: profiles
    description: >-
      Who watches on the household's devices (D94). Each profile keeps its
      own favourite channels, and how far it got into films and episodes. A
      device plays as one of them, its first until it is given another; a
      box running Overscan's page switches itself, and may need the
      profile's PIN to. The household always has at least one profile, and
      at most 12.
  - name: recordings
    description: >-
      Programmes that boxes record from the guide on this server (D89), and
      channels they record from now on (D98), once `recordings_cap` in the
      settings gives them room. A recording plays the channel through the
      stream hub, as a device of its own: a programme's from a minute
      before it to two minutes after it, and a channel's until the end of
      the programme the guide shows on it, or until it is stopped, for at
      most `recordings_max_hours`. Its file goes in the recordings folder,
      which a folder source reads.

paths:
  /session:
    post:
      tags: [session]
      operationId: signIn
      summary: Sign in
      description: |
        Starts a session for the administrator and sets its cookie. Failed
        sign-ins are slowed down: after five from one address within 15
        minutes, or fifty from all addresses together, the answer is 429
        until the oldest of them is 15 minutes old.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session's cookie, `overscan_admin`, which is HttpOnly and SameSite=Strict.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The username or password is wrong (`wrong_credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            No password is set yet (`no_administrator`): run
            `overscan admin password` on the server. Or the request came
            from another origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/NotJSON"
        "429":
          $ref: "#/components/responses/TooManyFailures"
    get:
      tags: [session]
      operationId: getSession
      summary: Describe the session
      description: Gives the session's CSRF token and times, for a script that has the cookie.
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    delete:
      tags: [session]
      operationId: signOut
      summary: Sign out
      description: Ends the session and clears its cookie.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"

  /server:
    get:
      tags: [server]
      operationId: getServer
      summary: Describe the server
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /streams:
    get:
      tags: [streams]
      operationId: listStreams
      summary: List what is playing
      description: >-
        The hub's sessions that have not ended, oldest first: those a player
        is fetching, and those that wait for their player to come back.
      responses:
        "200":
          description: The streams.
          content:
            application/json:
              schema:
                type: object
                required: [streams]
                properties:
                  streams:
                    type: array
                    items:
                      $ref: "#/components/schemas/Stream"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /streams/{id}/stop:
    parameters:
      - name: id
        in: path
        required: true
        description: The stream's `id`, as `GET /streams` gives it.
        schema:
          type: string
    post:
      tags: [streams]
      operationId: stopStream
      summary: Stop a stream
      description: >-
        Ends the stream, as the admin's Overview does (D138); the log says
        it was stopped through the API. The device can play it again. For a
        screen of a shared tuner, the screen alone. A recording's stream is
        not stopped (`recording`, 409): call the recording off instead.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Stopped.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          description: There is no such stream, or it has ended (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The stream is a recording's (`recording`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /health:
    get:
      tags: [health]
      operationId: listFailedChannels
      summary: List the channels that failed
      description: >-
        The channels whose streams failed to start the last time that they
        were played, and those hidden until they play again, those that
        failed last first: at most 500, and how many there are. Channels
        that their sources no longer list, and those of sources turned off,
        are left out.
      responses:
        "200":
          description: The channels.
          content:
            application/json:
              schema:
                type: object
                required: [channels, total]
                properties:
                  channels:
                    type: array
                    maxItems: 500
                    items:
                      $ref: "#/components/schemas/FailedChannel"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      tags: [health]
      operationId: holdFailedChannels
      summary: Hide every channel that failed, or show them all again
      description: >-
        With `hidden_until_played` true, hides every channel that the list
        holds until it plays again; with false, shows every hidden one
        again. Each lineup's rules run again.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldChannels"
      responses:
        "200":
          description: How many channels changed.
          content:
            application/json:
              schema:
                type: object
                required: [changed]
                properties:
                  changed:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "415":
          $ref: "#/components/responses/NotJSON"

  /health/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The channel's ID, its `channel_id` (not a lineup entry's).
        schema:
          type: integer
    put:
      tags: [health]
      operationId: holdChannel
      summary: Hide a channel until it plays again, or show it again
      description: >-
        Hidden, devices do not see the channel in any lineup until its
        stream plays again: as another channel's backup or a merged copy
        (D109, D113), or once it is shown again. Each lineup's rules run
        again, so a merge shows another copy and a group with a first
        number numbers without it (D137).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldChannels"
      responses:
        "200":
          description: The channel's health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelHealth"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/NotJSON"

  /capture:
    get:
      tags: [capture]
      operationId: listCaptures
      summary: List the capture log
      description: Each kind of request, the most recently asked for first.
      responses:
        "200":
          description: The capture log.
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/Capture"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    delete:
      tags: [capture]
      operationId: clearCaptures
      summary: Clear the capture log
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Cleared.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List the devices
      description: Those that wait for approval first, then the others by MAC address.
      responses:
        "200":
          description: The devices.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /devices/{mac}:
    parameters:
      - $ref: "#/components/parameters/MAC"
    patch:
      tags: [devices]
      operationId: changeDevice
      summary: Change a device's label, account or profile
      description: >-
        Gives the body's label, the account it belongs to (D102), the
        profile it plays as (D94), or more than one. Only an approved device
        belongs to an account and plays as one of its profiles
        (`not_approved`, 409); a device moved to another account plays as
        that account's first profile, and a profile of another account is
        refused (`other_account`, 409).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                label:
                  type: string
                  maxLength: 100
                  description: The new label; an empty one clears it.
                account_id:
                  type: integer
                  description: The account it belongs to from now on.
                profile_id:
                  type: integer
                  description: One of its account's profiles, which the device plays as from now on.
                output_profile:
                  description: >-
                    Its own output profile (D110), or "" to take its account's.
                    Unknown names are refused (`bad_output_profile`).
                  oneOf:
                    - $ref: "#/components/schemas/OutputProfile"
                    - type: string
                      enum: [""]
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "400":
          $ref: "#/components/responses/DeviceMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          description: There is no device with that MAC address (`no_such_device`), or no such profile of the household (`no_such_profile`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The device is not approved for the household (`not_approved`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/NotJSON"
    delete:
      tags: [devices]
      operationId: removeDevice
      summary: Remove a device
      description: Forgets the device. If it connects again, it waits for approval again.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/DeviceMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchDevice"

  /devices/{mac}/playback-check:
    parameters:
      - $ref: "#/components/parameters/MAC"
    delete:
      tags: [devices]
      operationId: forgetPlaybackCheck
      summary: Forget what a box's playback check found
      description: >-
        The box then plays films as its model's datasheet says, or as the
        last box of its model that was checked was found to play (D70). A
        box checks itself again from its Settings.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Forgotten.
        "400":
          $ref: "#/components/responses/DeviceMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          description: No such device (`no_such_device`), or it has not been checked (`no_check`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /devices/{mac}/approve:
    parameters:
      - $ref: "#/components/parameters/MAC"
    post:
      tags: [devices]
      operationId: approveDevice
      summary: Approve a device by its MAC address
      description: |
        Approves the device for an account, adding it if it has not
        connected yet, so that a Stalker client can be approved before it
        first connects. A box that waits with a code is paired with the
        secret it keeps. A paired box keeps its secret: to replace a pairing,
        approve the code that the new box shows.
      security:
        - session: []
          csrf: []
      requestBody:
        $ref: "#/components/requestBodies/Approval"
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "400":
          $ref: "#/components/responses/DeviceMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "415":
          $ref: "#/components/responses/NotJSON"

  /devices/{mac}/block:
    parameters:
      - $ref: "#/components/parameters/MAC"
    post:
      tags: [devices]
      operationId: blockDevice
      summary: Block a device
      description: Refuses the device, adding it if it has not connected yet. A request to pair it is dropped; a paired box keeps its secret, for if it is approved again.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "400":
          $ref: "#/components/responses/DeviceMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"

  /pairings/{code}/approve:
    parameters:
      - name: code
        in: path
        required: true
        description: The six-digit code that the box shows.
        schema:
          type: string
          pattern: "^[0-9]{6}$"
    post:
      tags: [devices]
      operationId: approvePairing
      summary: Approve a box by the code it shows
      description: Approves the box that waits with the code, for an account, and pairs it with the secret it keeps, replacing any earlier pairing of its MAC address.
      security:
        - session: []
          csrf: []
      requestBody:
        $ref: "#/components/requestBodies/Approval"
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "400":
          $ref: "#/components/responses/DeviceMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          description: No box waits with the code (`no_such_code`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/NotJSON"

  /themes:
    get:
      tags: [themes]
      operationId: listThemes
      summary: List the installed themes, and the household's
      responses:
        "200":
          description: The themes, by name, and the household's, 0 for Overscan's own.
          content:
            application/json:
              schema:
                type: object
                required: [household, themes]
                properties:
                  household:
                    type: integer
                  themes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Theme"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [themes]
      operationId: installTheme
      summary: Install a theme
      description: >-
        The body is the theme file itself, of at most 16 KB, which the
        theme guide (`docs/themes.md`) describes. A theme with the name of
        one installed already, whatever its case, replaces it (200); a new
        one answers 201.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeFile"
      responses:
        "200":
          $ref: "#/components/responses/Theme"
        "201":
          $ref: "#/components/responses/Theme"
        "400":
          description: The file does not check out (`bad_theme`); the message says why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "415":
          $ref: "#/components/responses/NotJSON"

  /themes/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      tags: [themes]
      operationId: removeTheme
      summary: Remove a theme
      description: What showed it shows the household's theme, or Overscan's own, instead.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchTheme"

  /theme:
    put:
      tags: [themes]
      operationId: setTheme
      summary: Choose the household's theme
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [theme_id]
              properties:
                theme_id:
                  type: integer
                  minimum: 0
                  description: An installed theme, or 0 for Overscan's own.
      responses:
        "200":
          description: The themes, as listed.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchTheme"
        "415":
          $ref: "#/components/responses/NotJSON"

  /messages:
    get:
      tags: [messages]
      operationId: listMessages
      summary: List the last messages
      description: The newest first, at most 100. A message stays listed for 30 days after its week is over.
      responses:
        "200":
          description: The messages.
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [messages]
      operationId: sendMessage
      summary: Send a message
      description: >-
        To the box with the MAC address, or without one to every box that
        runs Overscan's page, of every account, as it is now: a box paired
        later never shows it. At most 50 messages may wait to be read.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 500
                  description: Plain text; line breaks are kept, and boxes show it as text, never as markup.
                mac:
                  type: string
                  description: The box to send it to; empty or left out for every box.
      responses:
        "201":
          description: The message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: The text is empty, longer than 500 characters or holds a control character other than a line break (`bad_text`), the MAC address is not one (`bad_mac`), or the body is not the JSON the path takes (`bad_json`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchDevice"
        "409":
          description: >-
            The device does not run Overscan's page (`not_a_box`), no
            account has a box to send it to (`no_boxes`), or 50 messages
            wait to be read (`too_many_messages`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/NotJSON"

  /messages/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      tags: [messages]
      operationId: deleteMessage
      summary: Delete a message
      description: The boxes that have not shown it never will.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          description: There is no such message (`no_such_message`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: List the accounts
      description: >-
        The household's first, then in the order they were added (D102).
        An account never shows its password; it shows its playlist token
        only on `GET /accounts/{id}/token`.
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/OverscanAccount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [accounts]
      operationId: addAccount
      summary: Add an account
      description: >-
        The new account sees the household's lineup, takes the household's
        parental PIN and theme, and has a first profile named after it. It
        starts without a login, a token, an end date, a limit or an output.
        A server has at most 50 accounts (`too_many_accounts`, 409).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 50
      responses:
        "201":
          $ref: "#/components/responses/OverscanAccount"
        "400":
          $ref: "#/components/responses/AccountMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "409":
          $ref: "#/components/responses/AccountConflict"
        "415":
          $ref: "#/components/responses/NotJSON"

  /accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [accounts]
      operationId: getAccount
      summary: Get an account
      description: >-
        The account as the list shows it.
      responses:
        "200":
          $ref: "#/components/responses/OverscanAccount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NoSuchAccount"
    patch:
      tags: [accounts]
      operationId: changeAccount
      summary: Rename an account, or change its limit, outputs, theme, lineup or sources
      description: >-
        `max_streams` is the most streams that its devices and players play at once, 1 to 100, or 0 for any number;
        a device that starts another stream at the limit replaces its own oldest, and another device's is refused
        (`account_limit` in the device API, `limit` in the Stalker API). `outputs` says which outputs it may use, all
        off at first; `theme_id` is the theme of its boxes, 0 for Overscan's own (D97). `lineup_id` is the lineup it
        sees (D106): the favourites of its profiles and the lists of what its devices watched move to the same
        channels in it, and those that it lacks are forgotten. `sources` are the IDs of the sources that it uses
        (D114), one at least, or null for every source; what its devices, players and recordings play from
        another source stops.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  maxLength: 50
                max_streams:
                  type: integer
                  minimum: 0
                  maximum: 100
                outputs:
                  $ref: "#/components/schemas/AccountOutputs"
                theme_id:
                  type: integer
                  minimum: 0
                lineup_id:
                  type: integer
                  minimum: 1
                output_profile:
                  $ref: "#/components/schemas/OutputProfile"
                sources:
                  type: ["array", "null"]
                  minItems: 1
                  items:
                    type: integer
                    minimum: 1
      responses:
        "200":
          $ref: "#/components/responses/OverscanAccount"
        "400":
          $ref: "#/components/responses/AccountMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchAccount"
        "409":
          $ref: "#/components/responses/AccountConflict"
        "415":
          $ref: "#/components/responses/NotJSON"
    delete:
      tags: [accounts]
      operationId: removeAccount
      summary: Remove an account
      description: >-
        Its profiles go with it, with their favourites and resume points, and so do its messages. The household's
        account cannot be removed (`household`), nor one that a device is approved for (`has_devices`): move the
        device to another account first.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Done.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchAccount"
        "409":
          $ref: "#/components/responses/AccountConflict"

  /accounts/{id}/login:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [accounts]
      operationId: setAccountLogin
      summary: Set an account's login
      description: >-
        Players other than the boxes sign in with it through the Xtream output, while the account's `outputs.xtream`
        is on (D104); a new username or password stops what they play with the old one (D105). The username has 1 to 64 ASCII letters,
        digits, '.', '_', '-' or '@', and no other account has it, whatever its case (`username_taken`, 409). The
        password has 8 to 128 ASCII letters, digits, '.', '_', '-' or '~', which need no escaping in an address;
        it cannot be the administrator's or a source's (`password_in_use`). Overscan keeps only an argon2id hash of
        it. Without a password, the login keeps the one it has (`bad_password` if it has none).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username]
              properties:
                username:
                  type: string
                  maxLength: 64
                password:
                  type: string
                  maxLength: 128
      responses:
        "200":
          $ref: "#/components/responses/OverscanAccount"
        "400":
          $ref: "#/components/responses/AccountMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchAccount"
        "409":
          $ref: "#/components/responses/AccountConflict"
        "415":
          $ref: "#/components/responses/NotJSON"
    delete:
      tags: [accounts]
      operationId: removeAccountLogin
      summary: Remove an account's login
      description: >-
        Players can no longer sign in as it, and what they play with it stops (D105).
      security:
        - session: []
          csrf: []
      responses:
        "200":
          $ref: "#/components/responses/OverscanAccount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchAccount"
        "409":
          $ref: "#/components/responses/AccountConflict"

  /accounts/{id}/token:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [accounts]
      operationId: getAccountToken
      summary: Get an account's playlist token
      description: >-
        The token names the account in the addresses of its playlist and guide. An account without one answers
        `no_token` (404).
      responses:
        "200":
          description: The account's playlist token.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
                    description: 43 characters of URL-safe Base64.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NoSuchAccount"
    post:
      tags: [accounts]
      operationId: newAccountToken
      summary: Make an account a new playlist token
      description: >-
        It replaces the one the account had: addresses made with the old one stop working, and so does what players
        play with them (D105). A server without a key
        file cannot keep one (`no_key`, 409).
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: The account's playlist token.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
                    description: 43 characters of URL-safe Base64.
        "400":
          $ref: "#/components/responses/AccountMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchAccount"
        "409":
          $ref: "#/components/responses/AccountConflict"

  /accounts/{id}/expiry:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [accounts]
      operationId: setAccountExpiry
      summary: Set when an account ends
      description: >-
        From then on, its devices play nothing (D95).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expires_at]
              properties:
                expires_at:
                  type: string
                  format: date-time
      responses:
        "200":
          $ref: "#/components/responses/OverscanAccount"
        "400":
          $ref: "#/components/responses/AccountMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchAccount"
        "409":
          $ref: "#/components/responses/AccountConflict"
        "415":
          $ref: "#/components/responses/NotJSON"
    delete:
      tags: [accounts]
      operationId: removeAccountExpiry
      summary: Remove an account's end date
      description: >-
        It never ends.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          $ref: "#/components/responses/OverscanAccount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchAccount"
        "409":
          $ref: "#/components/responses/AccountConflict"

  /accounts/{id}/pin:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [accounts]
      operationId: setAccountPIN
      summary: Set an account's parental PIN
      description: >-
        Four to eight digits (`bad_pin`), kept as an argon2id hash. Locked channels, films and series ask for it
        on the account's boxes (D55).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pin]
              properties:
                pin:
                  type: string
                  pattern: "^[0-9]{4,8}$"
      responses:
        "200":
          $ref: "#/components/responses/OverscanAccount"
        "400":
          $ref: "#/components/responses/AccountMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchAccount"
        "409":
          $ref: "#/components/responses/AccountConflict"
        "415":
          $ref: "#/components/responses/NotJSON"
    delete:
      tags: [accounts]
      operationId: removeAccountPIN
      summary: Remove an account's parental PIN
      description: >-
        Its locks do nothing until it has one.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          $ref: "#/components/responses/OverscanAccount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchAccount"
        "409":
          $ref: "#/components/responses/AccountConflict"

  /profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      summary: List an account's profiles
      description: The first first, then in the order they were added; the household's, unless `account_id` names another account.
      parameters:
        - name: account_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: The profiles.
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [profiles]
      operationId: addProfile
      summary: Add a profile
      description: The new profile has no favourites, nothing watched and no PIN.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 32
                account_id:
                  type: integer
                  description: The account it is for; the household's if not given.
      responses:
        "201":
          $ref: "#/components/responses/Profile"
        "400":
          $ref: "#/components/responses/ProfileMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "409":
          $ref: "#/components/responses/ProfileConflict"
        "415":
          $ref: "#/components/responses/NotJSON"

  /profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [profiles]
      operationId: changeProfile
      summary: Rename a profile, or set or remove its PIN
      description: >-
        A box asks for the profile's PIN, four to eight digits, before it
        switches to it; an empty `pin` removes it. Overscan keeps only an
        argon2id hash of it. Locked channels, films and series still need the
        household's parental PIN, whatever the profile.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  maxLength: 32
                pin:
                  type: string
                  pattern: "^([0-9]{4,8})?$"
                theme_id:
                  type: integer
                  minimum: 0
                  description: A theme of its own, or 0 for the household's (D97).
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "400":
          $ref: "#/components/responses/ProfileMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchProfile"
        "415":
          $ref: "#/components/responses/NotJSON"
    delete:
      tags: [profiles]
      operationId: removeProfile
      summary: Remove a profile
      description: >-
        Its favourites and how far it got into films and episodes go with
        it, and its devices play as the first profile. The household's only
        profile cannot be removed (`last_profile`).
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchProfile"
        "409":
          $ref: "#/components/responses/ProfileConflict"

  /lineups:
    get:
      tags: [lineups]
      operationId: listLineups
      summary: List the lineups
      description: The first made first, each with the accounts that see it and how many channels it shows.
      responses:
        "200":
          description: The lineups.
          content:
            application/json:
              schema:
                type: object
                required: [lineups]
                properties:
                  lineups:
                    type: array
                    items:
                      $ref: "#/components/schemas/LineupSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [lineups]
      operationId: copyLineup
      summary: Make a lineup, as a copy of another or empty
      description: >-
        The copy has the groups, the categories they hold, and the channels of the lineup that `copy_of` names, or
        else the one that the `lineup` parameter names, or else the household account's, with their numbers, pins,
        names, groups, visibility and locks; from then on it has edits of its own. With `own_groups`, the lineup
        starts empty instead, and holds only what its groups take (D136); `merge` gives it a rule that merges the
        copies of a channel (D113), by their guide or by their names, which can be changed or removed like any
        other. No account sees it until one is given it. A server has at most 20 lineups (`too_many_lineups`, 409).
      parameters:
        - $ref: "#/components/parameters/Lineup"
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 50
                copy_of:
                  type: integer
                  minimum: 1
                own_groups:
                  type: boolean
                  description: Start empty, holding only what its groups take; not with `copy_of`.
                merge:
                  type: string
                  enum: ["", guide, name]
                  description: With `own_groups`, merge the copies of a channel from the start, by their guide or by their names.
      responses:
        "201":
          description: The new lineup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchLineup"
        "409":
          $ref: "#/components/responses/LineupConflict"
  /lineups/file:
    get:
      tags: [lineups]
      operationId: exportLineups
      summary: Export every lineup
      description: >-
        One YAML file that holds, for each lineup, the groups made or changed in it with the categories they hold,
        its channels changed by hand with their backups, and its rules (D112). Sources are named, and channels
        known by their source and the key that their source gives them. The file holds no address, login or token.
        `docs/lineup-file.md` describes it.
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              description: Names the file `overscan-lineups-<date>.yaml`.
              schema:
                type: string
          content:
            application/yaml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [lineups]
      operationId: importLineups
      summary: Import the lineups of a file
      description: >-
        Adds every lineup of the file as a new lineup, all of them or none, and changes no lineup that is there.
        Each starts as a lineup made anew, with every channel numbered as usual, then takes the file's groups,
        channels, backups and rules. What names a source or a channel that this server lacks is left out, and
        counted in `left_out`. A lineup whose name another has gets a number after it. No account sees the new
        lineups until one is given them. A file has at most 2 MB (413), and a server at most 20 lineups
        (`too_many_lineups`, 409).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        description: A file that `GET /lineups/file` made, or one written as `docs/lineup-file.md` says.
        content:
          application/yaml:
            schema:
              type: string
      responses:
        "201":
          description: The lineups added.
          content:
            application/json:
              schema:
                type: object
                required: [lineups]
                properties:
                  lineups:
                    type: array
                    items:
                      $ref: "#/components/schemas/LineupImport"
        "400":
          description: The file is not a lineup file, is of a later version, or holds a mistake, which the message names (`bad_file`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "409":
          $ref: "#/components/responses/LineupConflict"
        "413":
          description: The file is larger than 2 MB (`bad_file`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /lineups/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [lineups]
      operationId: renameLineup
      summary: Rename a lineup
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 50
      responses:
        "200":
          description: The lineup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchLineup"
        "409":
          $ref: "#/components/responses/LineupConflict"
    delete:
      tags: [lineups]
      operationId: removeLineup
      summary: Remove a lineup
      description: >-
        Only a lineup that no account sees (`lineup_in_use`, 409). Its groups and edits go with it, and so do the
        favourites and the lists of what devices watched that pointed at its channels.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchLineup"
        "409":
          $ref: "#/components/responses/LineupConflict"
  /lineup/groups:
    parameters:
      - $ref: "#/components/parameters/Lineup"
    get:
      tags: [lineup]
      operationId: listGroups
      summary: List the lineup's groups
      description: >-
        Groups with channels that devices see come first, in the order of
        their first channel, then the others by name. A group with ID 0, if
        there is one, holds the channels in no group.
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [lineup]
      operationId: createGroup
      summary: Make a group
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
      responses:
        "201":
          $ref: "#/components/responses/Group"
        "400":
          $ref: "#/components/responses/EditMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "409":
          $ref: "#/components/responses/EditConflict"
        "415":
          $ref: "#/components/responses/NotJSON"

  /lineup/groups/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Lineup"
    patch:
      tags: [lineup]
      operationId: changeGroup
      summary: Rename, hide, show, lock or number a group
      description: >-
        A hidden group hides its channels, those that its categories bring
        later included, apart from those shown on their own. A locked group's
        channels need the parental PIN. `numbers_from` gives the group a first
        number (D137): its channels are numbered from it again, in their
        order, and a channel that joins it later takes the next free number
        after its last; numbers set by hand or by a rule, and other groups'
        numbers, stay where they are, and a channel hidden on its own gives
        its number up. 0 takes the first number away, and the channels keep
        their numbers.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 100
                hidden:
                  type: boolean
                locked:
                  type: boolean
                numbers_from:
                  type: integer
                  minimum: 0
                  maximum: 999999
      responses:
        "200":
          $ref: "#/components/responses/Group"
        "400":
          $ref: "#/components/responses/EditMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EditConflict"
        "415":
          $ref: "#/components/responses/NotJSON"
    delete:
      tags: [lineup]
      operationId: deleteGroup
      summary: Delete an empty group
      description: Only a group with no category that a source still has, and no channel moved there, can be deleted (`group_not_empty`); merge it into another instead.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EditConflict"

  /lineup/groups/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Lineup"
    post:
      tags: [lineup]
      operationId: mergeGroup
      summary: Merge a group into another
      description: Moves the group's categories, and the channels moved there, into another group, and removes it.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [into]
              properties:
                into:
                  type: integer
                  description: The group to merge into.
      responses:
        "200":
          $ref: "#/components/responses/Group"
        "400":
          $ref: "#/components/responses/EditMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/NotJSON"

  /lineup/groups/{id}/number:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Lineup"
    post:
      tags: [lineup]
      operationId: numberGroup
      summary: Number a group from a starting number
      description: >-
        Pins the numbers of the group's channels that devices see to from,
        from + 1 and so on, in their present order. A channel that held one
        of those numbers takes the old number of the channel that took it.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from]
              properties:
                from:
                  type: integer
                  minimum: 1
                  maximum: 999999
      responses:
        "200":
          description: Numbered.
          content:
            application/json:
              schema:
                type: object
                required: [numbered]
                properties:
                  numbered:
                    type: integer
                    description: How many channels were numbered.
        "400":
          $ref: "#/components/responses/EditMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/NotJSON"

  /lineup/groups/{id}/categories:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Lineup"
    put:
      tags: [lineup]
      operationId: setGroupCategories
      summary: Choose the categories a group takes
      description: >-
        The group takes exactly these live categories, of any source, and the channels that they bring now and
        later (D136): those that another group of the lineup took move to it, and those it took that the list
        leaves out leave it. In a lineup of its own groups, their channels then leave the lineup, keeping their
        edits for when a group takes them again; in one that takes every category, each goes back to a group of
        its own name. A category is one that `GET /lineup/categories` lists, or one the group takes already; `name`
        "" is a source's channels without a category. At most 1,000.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [categories]
              properties:
                categories:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    additionalProperties: false
                    required: [source_id, name]
                    properties:
                      source_id:
                        type: integer
                      name:
                        type: string
      responses:
        "200":
          $ref: "#/components/responses/Group"
        "400":
          $ref: "#/components/responses/EditMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/NotJSON"
  /lineup/groups/{id}/sort:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Lineup"
    post:
      tags: [lineup]
      operationId: sortGroup
      summary: Sort a group's channels by name
      description: >-
        The group's channels take the numbers they hold between them, the
        lowest for the first name, in natural order, so that 2 comes before
        10 (D137). Numbers set by hand or by a rule, and channels hidden on
        their own, stay where they are.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: Sorted.
          content:
            application/json:
              schema:
                type: object
                required: [sorted]
                properties:
                  sorted:
                    type: integer
                    description: How many channels took another number.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
  /lineup/groups/replace:
    parameters:
      - $ref: "#/components/parameters/Lineup"
    post:
      tags: [lineup]
      operationId: replaceGroupNames
      summary: Find and replace in the names of the lineup's groups
      description: >-
        `find` is found whatever its case; between slashes, it is a regular
        expression, and `$1` and so on in `replace` are its groups, as in a
        rename rule (D107, D137). A name that would be left empty stays as it
        is. Every group is renamed, or none: a name that cannot be one
        (`bad_name`) or two groups with one name (`name_taken`, 409) change
        nothing.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Replace"
      responses:
        "200":
          $ref: "#/components/responses/Renamed"
        "400":
          $ref: "#/components/responses/EditMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "409":
          $ref: "#/components/responses/EditConflict"
        "415":
          $ref: "#/components/responses/NotJSON"
  /lineup/categories:
    parameters:
      - $ref: "#/components/parameters/Lineup"
    get:
      tags: [lineup]
      operationId: listLineupCategories
      summary: List every source's live categories, for the lineup's groups
      description: >-
        The live categories that each source brings (D135), as its reads list them, by source and in each
        source's order, with the group of the lineup that takes each: at most 2,000, with how many match in all.
      parameters:
        - name: q
          in: query
          description: Only the categories whose names hold this text, in any case.
          schema:
            type: string
      responses:
        "200":
          description: The categories.
          content:
            application/json:
              schema:
                type: object
                required: [categories, total]
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      required: [source_id, source, name, channels, group_id, group]
                      properties:
                        source_id:
                          type: integer
                        source:
                          type: string
                        name:
                          type: string
                          description: '"" for the source''s channels without a category.'
                        channels:
                          type: integer
                          description: The channels it held at the last read that listed it.
                        group_id:
                          type: [integer, "null"]
                          description: The group of the lineup that takes it; null if none.
                        group:
                          type: string
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NoSuchLineup"
  /lineup/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Lineup"
    put:
      tags: [lineup]
      operationId: moveCategory
      summary: Put a source's category in a group
      description: The category, by the ID in a group's `categories`, and the channels it brings, now and later, go to the group.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [group_id]
              properties:
                group_id:
                  type: integer
      responses:
        "200":
          $ref: "#/components/responses/Group"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/NotJSON"

  /lineup/channels:
    parameters:
      - $ref: "#/components/parameters/Lineup"
    get:
      tags: [lineup]
      operationId: listChannels
      summary: List the lineup's channels
      description: >-
        By number, with the channels that have none last, from enabled
        sources. Hidden channels, and channels that their source no longer
        lists, are included, with their edits.
      parameters:
        - name: group
          in: query
          description: Only the channels in this group; 0 for those in none.
          schema:
            type: integer
            minimum: 0
        - name: q
          in: query
          description: Only the channels whose name holds this, in any case.
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: A page of channels, and how many there are in all.
          content:
            application/json:
              schema:
                type: object
                required: [total, channels]
                properties:
                  total:
                    type: integer
                  channels:
                    type: array
                    items:
                      $ref: "#/components/schemas/Channel"
        "400":
          description: A query parameter is not valid (`bad_query`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      tags: [lineup]
      operationId: changeChannels
      summary: Move, hide, show or lock several channels
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                group_id:
                  type: [integer, "null"]
                  description: The group to move them to; null puts them back in their categories' groups.
                visibility:
                  $ref: "#/components/schemas/Visibility"
                locked:
                  type: boolean
                  description: Locked on their own; those in a locked group need the PIN either way.
                repair:
                  type: [boolean, "null"]
                  description: Their channels' own repair switch (D57); null gives them back to the default (D58).
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                required: [changed]
                properties:
                  changed:
                    type: integer
        "400":
          $ref: "#/components/responses/EditMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/NotJSON"

  /lineup/channels/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Lineup"
    patch:
      tags: [lineup]
      operationId: changeChannel
      summary: Change a channel
      description: >-
        A field left out stays as it is; null gives it back to Overscan: the
        source's name, the category's group, automatic numbering (D40). A
        number pins it; the channel that held the number takes the old one.
        Everything is checked before anything changes.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: [string, "null"]
                  maxLength: 200
                group_id:
                  type: [integer, "null"]
                visibility:
                  $ref: "#/components/schemas/Visibility"
                locked:
                  type: boolean
                repair:
                  type: [boolean, "null"]
                  description: Its channel's own repair switch (D57); null gives it back to the default (D58).
                number:
                  type: [integer, "null"]
                  minimum: 1
                  maximum: 999999
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/EditMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
  /lineup/channels/{id}/backups:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Lineup"
    get:
      tags: [lineup]
      operationId: listBackups
      summary: List a channel's backups
      description: >-
        The lineup's channels whose streams the hub tries in turn when this
        channel's own cannot start (D109): its source is at its limit, gives
        no address for it, or does not send it.
      responses:
        "200":
          $ref: "#/components/responses/Backups"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [lineup]
      operationId: setBackups
      summary: Set a channel's backups
      description: >-
        The lineup's channels given, by their IDs, in the order to try them,
        in place of those it had; an empty list removes them. A channel has
        at most 5 (`too_many_backups`, 409); it cannot be its own backup, nor
        one twice (`bad_backup`). A backup of another source plays from that
        source, counted against its limit.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entries]
              properties:
                entries:
                  type: array
                  maxItems: 5
                  items:
                    type: integer
      responses:
        "200":
          $ref: "#/components/responses/Backups"
        "400":
          $ref: "#/components/responses/EditMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The channel would have more than 5 backups (`too_many_backups`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/NotJSON"
  /lineup/rules:
    parameters:
      - $ref: "#/components/parameters/Lineup"
    get:
      tags: [lineup]
      operationId: listRules
      summary: List the lineup's rules
      description: >-
        In the order that they run (D107), each with how many of the lineup's
        channels it matches, whether it is on or off.
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/Rule"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NoSuchLineup"
    post:
      tags: [lineup]
      operationId: addRule
      summary: Add a rule after the others
      description: >-
        The lineup's rules run again at once. A lineup has at most 200 rules
        (`too_many_rules`, 409).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleBody"
      responses:
        "201":
          $ref: "#/components/responses/Rule"
        "400":
          $ref: "#/components/responses/RuleMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NoSuchLineup"
        "409":
          $ref: "#/components/responses/TooManyRules"
        "415":
          $ref: "#/components/responses/NotJSON"
  /lineup/rules/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Lineup"
    put:
      tags: [lineup]
      operationId: replaceRule
      summary: Replace a rule
      description: It keeps its place; the lineup's rules run again at once.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleBody"
      responses:
        "200":
          $ref: "#/components/responses/Rule"
        "400":
          $ref: "#/components/responses/RuleMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/NotJSON"
    delete:
      tags: [lineup]
      operationId: removeRule
      summary: Remove a rule
      description: What it did to channels is undone, as the lineup's rules run again at once.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
  /lineup/rules/{id}/move:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Lineup"
    post:
      tags: [lineup]
      operationId: moveRule
      summary: Move a rule to another place
      description: >-
        Places count from 1; a place after the last moves it to the end. The
        lineup's rules run again at once.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [position]
              properties:
                position:
                  type: integer
                  minimum: 1
      responses:
        "200":
          $ref: "#/components/responses/Rule"
        "400":
          $ref: "#/components/responses/RuleMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/NotJSON"

  /pin:
    get:
      tags: [lineup]
      operationId: getPIN
      summary: Whether the household has a parental PIN
      responses:
        "200":
          $ref: "#/components/responses/PIN"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      tags: [lineup]
      operationId: setPIN
      summary: Set the parental PIN
      description: >-
        Four to eight digits, which a remote control can type. Overscan keeps
        only an argon2id hash of it.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pin]
              properties:
                pin:
                  type: string
                  pattern: "^[0-9]{4,8}$"
      responses:
        "200":
          $ref: "#/components/responses/PIN"
        "400":
          description: The PIN is not four to eight digits (`bad_pin`), or the body is not the JSON the path takes (`bad_json`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "415":
          $ref: "#/components/responses/NotJSON"
    delete:
      tags: [lineup]
      operationId: removePIN
      summary: Remove the parental PIN
      description: Locked groups and channels stay locked, but play without a PIN until one is set.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          $ref: "#/components/responses/PIN"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"

  /expiry:
    get:
      tags: [lineup]
      operationId: getExpiry
      summary: When the household's account ends
      responses:
        "200":
          $ref: "#/components/responses/Expiry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      tags: [lineup]
      operationId: setExpiry
      summary: Set when the household's account ends
      description: >-
        From that time, its boxes say that the account has ended and play
        nothing, its Stalker clients are refused as blocked ones are, and its
        recordings stop (D95). A time that has passed ends the account at
        once. The admin's page sets the start of the day after the one
        chosen, in the server's time zone.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expires_at]
              properties:
                expires_at:
                  type: string
                  format: date-time
                  examples: ["2028-01-01T00:00:00Z"]
      responses:
        "200":
          $ref: "#/components/responses/Expiry"
        "400":
          description: The time is missing or not one (`bad_date`), or the body is not the JSON the path takes (`bad_json`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "415":
          $ref: "#/components/responses/NotJSON"
    delete:
      tags: [lineup]
      operationId: removeExpiry
      summary: Remove the household's end date
      description: The account never ends, and its boxes and Stalker clients play again.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          $ref: "#/components/responses/Expiry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"

  /settings:
    get:
      tags: [lineup]
      operationId: getSettings
      summary: Settings for the whole server
      responses:
        "200":
          $ref: "#/components/responses/Settings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      tags: [lineup]
      operationId: changeSettings
      summary: Change settings for the whole server
      description: Settings left out of the body stay as they are.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                repair_default:
                  type: boolean
                repair_hls:
                  type: boolean
                transcode_video:
                  type: integer
                  minimum: 0
                  maximum: 3
                convert_sound:
                  type: boolean
                server_transcodes:
                  type: boolean
                adult_marks:
                  type: string
                  enum: [nothing, lock, hide]
                radio_apart:
                  type: boolean
                tmdb_key:
                  type: string
                  maxLength: 1024
                  description: >-
                    TMDB's API key or read access token, which TMDB must take
                    when it can be asked; "" removes it (D88). It is never
                    given back.
                tmdb_language:
                  type: string
                  pattern: "^([a-z]{2}(-[A-Z]{2})?)?$"
                recordings_cap:
                  type: integer
                  minimum: 0
                  maximum: 4000
                  description: >-
                    The room that recordings may take, in gigabytes; 0 turns
                    recording off (D89). Turning it on makes the recordings
                    folder and, unless a source reads it, a folder source
                    for it. A server that cannot record answers 503
                    (`no_recorder`).
                recordings_until:
                  type: string
                  enum: [programme, stopped]
                  description: >-
                    What a recording that a box starts on a channel runs
                    until, while the guide shows a programme on it: its end,
                    or until it is stopped (D98).
                recordings_max_hours:
                  type: integer
                  minimum: 1
                  maximum: 24
                  description: >-
                    The most hours that a recording which runs until it is
                    stopped may run (D98).
                timeshift_minutes:
                  type: integer
                  minimum: 0
                  maximum: 240
                  description: >-
                    How many minutes of the channel a box watches the server
                    keeps on disk, so that the box can pause live TV and go
                    back in it (D92); 0 turns timeshift off. It applies from
                    the next channel a box plays.
                shared_tuner:
                  type: boolean
                  description: >-
                    One connection to a source serves every screen that
                    plays a channel: boxes, Stalker clients and recordings
                    (D93). It applies from the next channel a screen plays.
                outputs:
                  type: boolean
                  description: >-
                    The outputs that players other than the boxes use: each
                    account's playlist and guide (D103) and its Xtream login
                    (D104), for accounts whose own switches are on too.
                    Turning them off stops what players play (D105).
                outputs_anywhere:
                  type: boolean
                  description: >-
                    The outputs answer players from any address, not only
                    from this server's own networks.
      responses:
        "200":
          $ref: "#/components/responses/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "415":
          $ref: "#/components/responses/NotJSON"
        "503":
          $ref: "#/components/responses/NoRecorder"

  /recordings:
    get:
      tags: [recordings]
      operationId: listRecordings
      summary: List the recordings
      description: >-
        The recordings to come and under way, the soonest first, and the last
        hundred that were made, failed or were called off, the latest first,
        with the room they may take and the room they take.
      responses:
        "200":
          description: The recordings.
          content:
            application/json:
              schema:
                type: object
                required: [cap_gb, used_bytes, upcoming, recent]
                properties:
                  cap_gb:
                    type: integer
                    description: The room they may take, in gigabytes; 0 while recording is off.
                  used_bytes:
                    type: integer
                    description: The room the files in the recordings folder take.
                  upcoming:
                    type: array
                    items:
                      $ref: "#/components/schemas/Recording"
                  recent:
                    type: array
                    items:
                      $ref: "#/components/schemas/Recording"
        "401":
          $ref: "#/components/responses/Unauthenticated"

    post:
      tags: [recordings]
      operationId: scheduleRecording
      summary: Record a programme
      description: >-
        Schedules a programme of a channel in the household's lineup, named
        by when it begins, as the guide gives it, as a box does from its
        guide. Scheduling it again answers the recording already scheduled.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry_id, start]
              properties:
                entry_id:
                  type: integer
                  description: The lineup entry, as the channels' list gives it.
                start:
                  type: string
                  format: date-time
      responses:
        "200":
          description: The recording.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          description: The lineup has no such channel, or its guide no programme that starts then (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Recording is off (`recording_off`), the programme has ended
            (`programme_ended`), or it has been recorded already
            (`recorded`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/NotJSON"

  /recordings/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [recordings]
      operationId: cancelRecording
      summary: Call a recording off, or stop one under way
      description: >-
        A recording to come is called off. One under way stops now, and what
        it has written is kept, as a recording made.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: The recording, as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: It is no longer to come (`not_to_come`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /recordings/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      tags: [recordings]
      operationId: deleteRecording
      summary: Delete a recording
      description: >-
        Deletes a recording that was made, failed or was called off, with its
        file.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: It is still to come or under way (`to_come`); call it off first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/{kind}/shelves:
    parameters:
      - $ref: "#/components/parameters/Kind"
    get:
      tags: [library]
      operationId: listShelves
      summary: List the shelves of films or of series
      description: >-
        Every shelf, hidden ones too, in the order devices see them in: those
        the administrator put in an order first, then the others in their
        sources' order.
      responses:
        "200":
          $ref: "#/components/responses/Shelves"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /library/{kind}/shelves/replace:
    parameters:
      - $ref: "#/components/parameters/Kind"
    post:
      tags: [library]
      operationId: replaceShelfNames
      summary: Find and replace in the names of the shelves
      description: >-
        As `POST /lineup/groups/replace` does for groups, on the names that
        devices see the shelves by (D137). A shelf whose name becomes its
        sources' name has it back.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Replace"
      responses:
        "200":
          $ref: "#/components/responses/Renamed"
        "400":
          $ref: "#/components/responses/EditMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/NotJSON"
  /library/{kind}/shelves/{id}:
    parameters:
      - $ref: "#/components/parameters/Kind"
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [library]
      operationId: changeShelf
      summary: Hide, show, lock, unlock or rename a shelf
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                hidden:
                  type: boolean
                locked:
                  type: boolean
                  description: Every title on it needs the parental PIN (D85).
                name:
                  type: [string, "null"]
                  maxLength: 100
                  description: The name devices see it by; null or empty for its sources' name.
      responses:
        "200":
          description: The shelf.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shelf"
        "400":
          $ref: "#/components/responses/EditMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/NotJSON"

  /library/{kind}/order:
    parameters:
      - $ref: "#/components/parameters/Kind"
    put:
      tags: [library]
      operationId: orderShelves
      summary: Put shelves in an order of their own
      description: >-
        The shelves given come first, in that order; the others after them,
        in their sources' order. Each must be listed, once (`bad_shelves`).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shelves]
              properties:
                shelves:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          $ref: "#/components/responses/Shelves"
        "400":
          $ref: "#/components/responses/EditMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/NotJSON"
    delete:
      tags: [library]
      operationId: resetShelfOrder
      summary: Give every shelf back its sources' order
      security:
        - session: []
          csrf: []
      responses:
        "200":
          $ref: "#/components/responses/Shelves"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"

  /library/{kind}/titles:
    parameters:
      - $ref: "#/components/parameters/Kind"
    get:
      tags: [library]
      operationId: listTitles
      summary: List films or series, hidden ones too
      description: By name, a page at a time.
      parameters:
        - name: shelf
          in: query
          description: A shelf's ID, for its titles alone.
          schema:
            type: integer
        - name: q
          in: query
          description: A part of the names, whatever the case of letters A to Z.
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: The titles, and how many there are in all.
          content:
            application/json:
              schema:
                type: object
                required: [total, titles]
                properties:
                  total:
                    type: integer
                  titles:
                    type: array
                    items:
                      $ref: "#/components/schemas/LibraryTitle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /library/titles/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [library]
      operationId: changeTitle
      summary: Hide, show, lock or unlock a film or a series
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                hidden:
                  type: boolean
                locked:
                  type: boolean
                  description: It needs the parental PIN (D85); one on a locked shelf stays locked.
      responses:
        "200":
          description: The title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryTitle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/NotJSON"

  /guides:
    get:
      tags: [guides]
      operationId: listGuides
      summary: List the guides of the household's own
      description: >-
        Each guide without its address, which can hold credentials and is
        never shown again once saved; `host` says where it points. The guides
        come in their order: where two could fill a channel, the first does.
      responses:
        "200":
          description: The guides, in their order.
          content:
            application/json:
              schema:
                type: object
                required: [guides, without_guide]
                properties:
                  guides:
                    type: array
                    items:
                      $ref: "#/components/schemas/OwnGuide"
                  without_guide:
                    type: integer
                    description: >-
                      The channels of enabled sources that their sources
                      still list, with no programme of their own and no
                      guide of the household's own to fill them.
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [guides]
      operationId: addGuide
      summary: Add a guide
      description: >-
        Adds a guide after the others, and reads it at once. `address` is
        needed; `position` is not taken: move a guide with
        `PATCH /guides/{id}`. A server keeps at most 20 guides.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnGuideSettings"
      responses:
        "201":
          $ref: "#/components/responses/OwnGuide"
        "400":
          $ref: "#/components/responses/OwnGuideMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "409":
          $ref: "#/components/responses/OwnGuideConflict"
        "415":
          $ref: "#/components/responses/NotJSON"

  /guides/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [guides]
      operationId: getGuide
      summary: A guide of the household's own
      responses:
        "200":
          $ref: "#/components/responses/OwnGuide"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [guides]
      operationId: changeGuide
      summary: Change a guide
      description: >-
        Changes what the body gives and keeps the rest, including the saved
        address unless `address` is given. A new address, user agent or
        choice of public addresses makes the guide read again at once.
        `enabled` false makes it fill no channel from then on; `position`
        moves it, from 1 for the first, the others moving along.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnGuideSettings"
      responses:
        "200":
          $ref: "#/components/responses/OwnGuide"
        "400":
          $ref: "#/components/responses/OwnGuideMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnGuideConflict"
        "415":
          $ref: "#/components/responses/NotJSON"
    delete:
      tags: [guides]
      operationId: deleteGuide
      summary: Remove a guide
      description: >-
        Removes the guide with its channels and programmes. The channels
        that it filled take another guide's where one has their guide IDs or
        names.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"

  /guides/{id}/read:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [guides]
      operationId: readGuide
      summary: Read a guide now
      description: >-
        Reads the guide now, whatever its schedule, once a read of another
        guide under way ends, and waits up to 20 seconds for it. A read that
        takes longer goes on: the answer is then 202, with `reading` true,
        and the guide's `read_at` and `read_error` say how it ended.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: What the read found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnGuideRead"
        "202":
          description: The read goes on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnGuideRead"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnGuideConflict"
        "502":
          $ref: "#/components/responses/OwnGuideFailed"
        "503":
          description: >-
            This server cannot read guides from the admin (`no_reader`), or
            other reads of guides wait already (`busy`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sources:
    get:
      tags: [sources]
      operationId: listSources
      summary: List the sources
      description: >-
        Each source without its address, which can hold the credentials of an
        account and is never shown again once saved (D46); `host` says where
        it points.
      responses:
        "200":
          description: The sources, by name.
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/Source"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [sources]
      operationId: addSource
      summary: Add a source
      description: >-
        Adds a source and reads it at once. What the body leaves out takes its
        default: an M3U playlist, one stream at a time, read every six hours,
        numbered in playlist order.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSettings"
      responses:
        "201":
          $ref: "#/components/responses/Source"
        "400":
          $ref: "#/components/responses/SourceMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "409":
          $ref: "#/components/responses/SourceConflict"
        "415":
          $ref: "#/components/responses/NotJSON"

  /sources/test:
    post:
      tags: [sources]
      operationId: testNewSource
      summary: Test a source's settings without saving them
      description: Reads the address as a refresh would, and says what it found. Nothing is stored.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSettings"
      responses:
        "200":
          $ref: "#/components/responses/Tested"
        "400":
          $ref: "#/components/responses/SourceMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "415":
          $ref: "#/components/responses/NotJSON"
        "502":
          $ref: "#/components/responses/SourceFailed"

  /sources/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [sources]
      operationId: changeSource
      summary: Change a source
      description: >-
        Changes what the body gives and keeps the rest, including the saved
        address unless `url` is given. A change of `numbers` numbers the
        source's channels again; numbers set in the lineup stay (D47).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSettings"
      responses:
        "200":
          $ref: "#/components/responses/Source"
        "400":
          $ref: "#/components/responses/SourceMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SourceConflict"
        "415":
          $ref: "#/components/responses/NotJSON"
    delete:
      tags: [sources]
      operationId: deleteSource
      summary: Delete a source
      description: >-
        Deletes the source with its address and channels, which leave the
        lineup with their edits. Groups that Overscan made for its categories
        go too, unless the administrator changed them.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"

  /sources/{id}/refresh:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [sources]
      operationId: refreshSource
      summary: Read a source now
      description: Reads the source at once, whatever its schedule, and stores its channels.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: What the source listed.
          content:
            application/json:
              schema:
                type: object
                required: [channels, added, missing, removed, left_out]
                properties:
                  channels:
                    type: integer
                    description: The channels it lists, in the categories that it brings (D135).
                  added:
                    type: integer
                    description: Channels new to the catalog.
                  missing:
                    type: integer
                    description: Channels it stopped listing or bringing, kept for 7 days.
                  removed:
                    type: integer
                    description: Channels missing for longer than that, now gone.
                  left_out:
                    type: integer
                    description: Channels it listed in categories that it does not bring (D135).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SourceConflict"
        "502":
          $ref: "#/components/responses/SourceFailed"

  /sources/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [sources]
      operationId: testSource
      summary: Test a source, with changed settings if given
      description: >-
        Reads the source with its settings, overridden by what the optional
        body gives, without storing anything. Without `url`, it uses the saved
        address.
      security:
        - session: []
          csrf: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSettings"
      responses:
        "200":
          $ref: "#/components/responses/Tested"
        "400":
          $ref: "#/components/responses/SourceMistake"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SourceConflict"
        "415":
          $ref: "#/components/responses/NotJSON"
        "502":
          $ref: "#/components/responses/SourceFailed"

  /sources/{id}/categories/{kind}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/CategoryKind"
    get:
      tags: [sources]
      operationId: listSourceCategories
      summary: List what a source brings of a kind of category
      description: >-
          Whether the source brings every category of its live channels, its
          films or its series, or only those ticked, and the categories that
          its reads listed, ticked or not (D135), in the order of the last read
          that listed each, at most 1,000. A source without live channels has
          none of `live`, one without films and series none of `movies` and
          `series`, and a folder none at all: those answer 404.
      parameters:
        - name: q
          in: query
          required: false
          description: Only the categories whose names hold this text, whatever its case.
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/SourceCategories"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [sources]
      operationId: setSourceCategories
      summary: Change what a source brings of a kind of category
      description: >-
          Changes what the body gives and keeps the rest. Ticks name
          categories by their keys; a key that the source has no category
          for is left out. The change takes effect at the source's next read
          of the kind: `POST …/read` reads it now. The source is read with
          the same requests whatever it brings, and what a read lists in the
          categories that it does not bring is not stored. Channels and
          titles that it stops bringing are kept for 7 days, with their
          edits, favourites and progress, as those that it stops listing
          are, so that ticking their categories again brings them back.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceCategoriesChange"
      responses:
        "200":
          $ref: "#/components/responses/SourceCategories"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/NotJSON"

  /sources/{id}/categories/{kind}/read:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/CategoryKind"
    post:
      tags: [sources]
      operationId: readSourceCategories
      summary: Read a source's live channels, films or series now
      description: >-
          Reads the source's live channels as `sources/{id}/refresh` does,
          or its list of films or of series as a box's first request would
          (D63), so that a change to what it brings takes effect, or so that
          its categories of films or series can be chosen before a box asks
          for them. A read of films or series that takes longer than 20
          seconds goes on after the answer, 202.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: >-
            The read is done. For live channels, what it found, as
            `sources/{id}/refresh` says it; for films or series,
            `reading` false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesRead"
        "202":
          description: A read of films or series goes on; `reading` is true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesRead"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRF"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SourceConflict"
        "502":
          $ref: "#/components/responses/SourceFailed"

components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Lineup:
      name: lineup
      in: query
      required: false
      description: >-
        The lineup to read or change, by its ID (D106). Without it, the
        household account's. A lineup that does not exist answers 404.
      schema:
        type: integer
        minimum: 1
    Kind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [movies, series]
    CategoryKind:
      name: kind
      in: path
      required: true
      description: A source's categories of live channels, of films, or of series.
      schema:
        type: string
        enum: [live, movies, series]
    MAC:
      name: mac
      in: path
      required: true
      description: The device's MAC address, with colons or hyphens, such as `00:1A:79:00:00:01`.
      schema:
        type: string

  requestBodies:
    Approval:
      description: Optional. Without a body, the device is approved for the household account and keeps its label.
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              account_id:
                type: integer
                description: The account to approve the device for; the household account, 1, if not given.
              label:
                type: string
                maxLength: 100
                description: A label for the device, such as `Living room`; if empty, the device keeps its label.

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: overscan_admin
      description: The session's cookie, which `POST /session` sets.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        The session's CSRF token, from `POST /session` or `GET /session`.
        Every request that changes something sends it.

  schemas:
    Replace:
      type: object
      additionalProperties: false
      required: [find]
      properties:
        find:
          type: string
          maxLength: 200
        replace:
          type: string
          maxLength: 200
    LineupSummary:
      type: object
      required: [id, name, created_at, own_groups, accounts, viewers, shown, rules]
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
        own_groups:
          type: boolean
          description: >-
            It holds only what its groups take (D136); false for a lineup that takes every category of every
            source as groups of their own, as every lineup made before did.
        accounts:
          type: array
          description: The names of the accounts that see it.
          items:
            type: string
        viewers:
          type: array
          description: The accounts that see it, by name, with how their devices and players reach it.
          items:
            type: object
            required: [account_id, account, boxes, stalker_clients, playlist, xtream_login]
            properties:
              account_id:
                type: integer
              account:
                type: string
              boxes:
                type: integer
                description: Its approved boxes that run Overscan's page.
              stalker_clients:
                type: integer
                description: Its approved Stalker clients.
              playlist:
                type: boolean
                description: Its playlist and guide are on and it has a token (D103); they answer while the server's outputs are on.
              xtream_login:
                type: boolean
                description: Its Xtream login is on and it has a username (D104); it answers while the server's outputs are on.
        shown:
          type: integer
          description: How many channels it shows.
        rules:
          type: integer
          description: How many rules it has (D107), on or off.
    LineupImport:
      type: object
      required: [id, name, groups, channels, rules, left_out]
      properties:
        id:
          type: integer
        name:
          type: string
          description: The file's name for it, with a number after it if another lineup has that name.
        groups:
          type: integer
          description: The groups it took from the file.
        channels:
          type: integer
          description: The channels changed by hand that it took from the file.
        rules:
          type: integer
        left_out:
          type: object
          description: What it left out, since this server has no such source or channel.
          required: [categories, channels, backups, rules]
          properties:
            categories:
              type: integer
            channels:
              type: integer
            backups:
              type: integer
            rules:
              type: integer
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          examples: [admin]
        password:
          type: string
          format: password
    Session:
      type: object
      required: [username, csrf_token, created_at, last_seen]
      properties:
        username:
          type: string
          examples: [admin]
        csrf_token:
          type: string
          description: Sent in the `X-CSRF-Token` header with every request that changes something.
        created_at:
          type: string
          format: date-time
          description: When the session signed in, in UTC.
        last_seen:
          type: string
          format: date-time
          description: When the session was last used, in UTC, to the minute.
    Server:
      type: object
      required: [version, schema_version, started_at]
      properties:
        version:
          type: string
          description: Overscan's version.
          examples: [v0.0.10]
        schema_version:
          type: integer
          description: The version of the database's schema.
          examples: [7]
        started_at:
          type: string
          format: date-time
          description: When the server started, in UTC.
    Device:
      type: object
      required: [mac, state, label, model, account_id, profile_id, paired, pairing_code, pairing_requested_at, last_seen, created_at, playback_check]
      properties:
        mac:
          type: string
          description: Six upper-case hex pairs separated by colons.
          examples: ["00:1A:79:00:00:01"]
        state:
          type: string
          enum: [pending, approved, blocked]
        label:
          type: string
          description: Set by the administrator; empty if none.
        model:
          type: string
          description: As the device reports it; empty if it has not said.
        account_id:
          type: [integer, "null"]
          description: The account it is approved for; null if it was never approved.
        profile_id:
          type: [integer, "null"]
          description: The profile an approved device plays as (D94); null for a device that waits or is blocked.
        paired:
          type: boolean
          description: Whether a box is paired with its secret, so that a copied MAC address alone is not enough (D39).
        pairing_code:
          type: [string, "null"]
          description: The code of a request to pair that waits for approval; null if none.
        pairing_requested_at:
          type: [string, "null"]
          format: date-time
        last_seen:
          type: [string, "null"]
          format: date-time
          description: When the device last contacted Overscan, to the minute; null if never.
        created_at:
          type: string
          format: date-time
        playback_check:
          description: What the box's own playback check found (D70); null if it was not checked.
          oneOf:
            - $ref: "#/components/schemas/PlaybackCheck"
            - type: "null"
        output_profile:
          type: string
          description: Its own output profile (D110), or "" while it takes its account's.
    OutputProfile:
      type: string
      enum: [source, h264-720p, h264-1080p]
      description: >-
        How live channels reach a device or a player (D110): `source` as the
        source sends them; `h264-720p` and `h264-1080p` made H.264, at up to
        1280×720 or 1920×1080, with AAC sound in stereo, by this server's
        ffmpeg, while transcoding is on (`transcode_video` in the settings,
        each such stream counting against its number at a time), and as the
        source sends them otherwise.
    Theme:
      type: object
      required: [id, name, uses, file]
      properties:
        id:
          type: integer
        name:
          type: string
        uses:
          type: array
          items:
            type: string
          description: The names of the accounts and profiles that chose it.
        file:
          type: string
          description: The theme file, as Overscan keeps it.
    ThemeFile:
      type: object
      required: [overscan_theme, name, background, text]
      properties:
        overscan_theme:
          type: integer
          const: 1
        name:
          type: string
          maxLength: 40
        background:
          type: string
          pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
        text:
          type: string
          pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
        accent:
          type: string
          pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
        focus:
          type: string
          pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
        focus_text:
          type: string
          pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
        font:
          type: string
          enum: ["Instrument Sans", "Sans"]
        corners:
          type: string
          enum: [round, small, square]
        brand:
          type: string
          maxLength: 24
    Message:
      type: object
      required: [id, text, every_box, mac, sent_at, expires_at, boxes, read]
      properties:
        id:
          type: integer
        text:
          type: string
        every_box:
          type: boolean
          description: Whether it went to every box, not to one alone.
        mac:
          type: [string, "null"]
          description: The box it went to alone; null for every box.
        sent_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: A box that has not shown it by then never will.
        boxes:
          type: integer
          description: How many boxes it went to.
        read:
          type: integer
          description: How many of them read it.
    OverscanAccount:
      type: object
      required: [id, name, lineup_id, username, token, max_streams, outputs, expires_at, ended, pin, theme_id, devices, profiles, output_profile, sources]
      properties:
        id:
          type: integer
        name:
          type: string
          description: One to 50 characters, unlike any other account's name, whatever their case.
          examples: ["Alex"]
        lineup_id:
          type: integer
        username:
          type: ["string", "null"]
          description: Its login's username, or null while it has none.
        token:
          type: boolean
          description: Whether it has a playlist token.
        max_streams:
          type: integer
          description: The most streams its devices and players play at once, or 0 for any number.
        outputs:
          $ref: "#/components/schemas/AccountOutputs"
        expires_at:
          type: ["string", "null"]
          format: date-time
        ended:
          type: boolean
        pin:
          type: boolean
          description: Whether it has a parental PIN.
        theme_id:
          type: integer
        devices:
          type: integer
          description: How many approved devices belong to it.
        output_profile:
          $ref: "#/components/schemas/OutputProfile"
        profiles:
          type: integer
        sources:
          type: ["array", "null"]
          items:
            type: integer
          description: >-
            The IDs of the sources that it uses (D114), in order, or null for
            every source, those added later too. Its devices and players list
            and play only what comes from them: a channel shows when its own
            stream or a backup's does, and plays from those streams alone; its
            past programmes come from its own source. A list is empty only
            when the sources it used were removed.
    AccountOutputs:
      type: object
      additionalProperties: false
      properties:
        m3u:
          type: boolean
          description: >-
            Its playlist and guide, at addresses with its playlist token
            (D103). Turning it off stops what players play through it (D105).
        xtream:
          type: boolean
          description: >-
            The Xtream-compatible API, `get.php` and `xmltv.php`, for players
            that sign in with its login (D104), once it has one. Turning it
            off stops what players play through it (D105).
    Profile:
      type: object
      required: [id, account_id, name, first, pin, devices, theme_id]
      properties:
        account_id:
          type: integer
          description: The account whose profile it is.
        theme_id:
          type: integer
          description: Its own theme, or 0 for the household's.
        id:
          type: integer
        name:
          type: string
          description: One to 32 characters, unlike any other profile's name, whatever their case.
          examples: ["Alex"]
        first:
          type: boolean
          description: Whether it is the household's first profile, which devices play as until they are given another.
        pin:
          type: boolean
          description: Whether a box asks for its PIN before it switches to it.
        devices:
          type: integer
          description: How many approved devices play as it.
    PlaybackCheck:
      type: object
      required: [checked_at, firmware, plays, does_not_play]
      properties:
        checked_at:
          type: string
          format: date-time
        firmware:
          type: string
          description: The box's firmware version, as it reported it; empty if it did not.
        plays:
          type: array
          items:
            type: string
          description: What the check found the box plays, such as "Dolby Digital Plus", in the order it tests them.
          examples: [["MKV", "H.264", "AAC", "Dolby Digital"]]
        does_not_play:
          type: array
          items:
            type: string
          description: What it found the box does not play.
          examples: [["DTS", "Dolby TrueHD"]]
    Shelf:
      type: object
      required: [id, name, own, sources, titles, hidden_titles, portal, hidden, locked, placed]
      properties:
        id:
          type: integer
          description: The ID devices know the shelf by.
        name:
          type: string
          description: The name devices see it by.
        own:
          type: string
          description: The name its sources give it.
        sources:
          type: array
          items:
            type: string
          description: The names of the sources whose categories it holds.
        titles:
          type: integer
          description: Its titles, hidden ones too; for a portal's, those read so far.
        hidden_titles:
          type: integer
          description: Of them, those hidden one by one.
        portal:
          type: boolean
          description: A Stalker portal's category, read a page at a time (D77).
        hidden:
          type: boolean
        locked:
          type: boolean
          description: Locked, with every title on it (D85).
        placed:
          type: boolean
          description: The administrator put it in an order of its own.
    LibraryTitle:
      type: object
      required: [id, kind, name, source, hidden, locked, adult, needs_pin]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [movie, series]
        name:
          type: string
        year:
          type: integer
        source:
          type: string
          description: Its source's name.
        shelf:
          type: string
          description: Its category's name, as its source gives it.
        hidden:
          type: boolean
        locked:
          type: boolean
          description: The administrator locked it (D85).
        adult:
          type: boolean
          description: Its source marks it for adults (D86).
        needs_pin:
          type: boolean
          description: >-
            Devices need the parental PIN for it once the account has one: it,
            or its shelf, is locked, or the setting locks what is marked for
            adults.
    Group:
      type: object
      required: [id, name, hidden, locked, edited, channels, shown, first_number, categories]
      properties:
        id:
          type: integer
          description: Stays the same when the group is renamed; Stalker clients know it as the genre's ID.
        name:
          type: string
        hidden:
          type: boolean
        locked:
          type: boolean
          description: Its channels need the parental PIN (D55).
        edited:
          type: boolean
          description: Made or changed by the administrator. A group that Overscan made for a category, and nobody changed, goes when nothing is in it.
        channels:
          type: integer
          description: The channels in it that their sources list.
        shown:
          type: integer
          description: Of those, the ones devices see.
        first_number:
          type: [integer, "null"]
          description: The lowest number that devices see in it.
        numbers_from:
          type: [integer, "null"]
          description: Its first number (D137), which numbers its channels and those that join it; null if it has none.
        categories:
          type: array
          items:
            type: object
            required: [id, source_id, source, name]
            properties:
              id:
                type: [integer, "null"]
                description: The category's ID, for moving it; null if its source no longer has it, and for the channels without a category.
              source_id:
                type: integer
              source:
                type: string
              name:
                type: string
                description: '"" for the source''s channels without a category.'
              gone:
                type: boolean
                description: Its source no longer has the category.
    Channel:
      type: object
      required: [id, channel_id, source_id, source, number, pinned, name, channel_name, renamed, group_id, group, moved, category, visibility, hidden, missing, left_out, locked, group_locked, repair, repair_own, adult, radio, rules, backups, health]
      properties:
        id:
          type: integer
          description: The lineup entry's ID, which devices know the channel by.
        channel_id:
          type: integer
        source_id:
          type: integer
        source:
          type: string
        number:
          type: [integer, "null"]
          description: Null while it has none, when its source no longer lists it and another channel took its number.
        pinned:
          type: boolean
          description: The administrator set the number.
        name:
          type: string
          description: As devices see it.
        channel_name:
          type: string
          description: As the source names it.
        renamed:
          type: boolean
        group_id:
          type: [integer, "null"]
        group:
          type: [string, "null"]
        moved:
          type: boolean
          description: The administrator chose its group.
        category:
          type: [string, "null"]
          description: The source's category.
        visibility:
          $ref: "#/components/schemas/Visibility"
        hidden:
          type: boolean
          description: >-
            Devices do not see it, for whatever reason: hidden by hand, with
            its group, by a rule, or until its stream plays again (D138).
        missing:
          type: boolean
          description: Its source no longer lists it, or no longer brings its category; it is kept for 7 days, with its edits.
        left_out:
          type: boolean
          description: It is missing because its source no longer brings its category (D135).
        locked:
          type: boolean
          description: Locked on its own; it needs the parental PIN (D55).
        group_locked:
          type: boolean
          description: Its group is locked, so it needs the parental PIN whatever `locked` says.
        repair:
          type: boolean
          description: >-
            Its stream goes through ffmpeg, which copies it into a new MPEG-TS
            stream with its timestamps rebuilt (D57): its own switch says so,
            or else the default does (D58).
        repair_own:
          type: [boolean, "null"]
          description: >-
            Its own repair switch, null when it follows the default. The switch
            belongs to the source's channel, so it holds in every lineup that
            has it.
        adult:
          type: boolean
          description: Its source marks it for adults (D86).
        radio:
          type: boolean
          description: Its source lists it as a radio station (D87).
        rules:
          type: array
          description: >-
            What the lineup's rules do to it, by their actions (D107), even
            where the administrator's own edits win over them.
          items:
            $ref: "#/components/schemas/RuleAction"
        backups:
          type: integer
          description: How many backups it has (D109), listed at its `backups` path.
        rule_backups:
          type: integer
          description: >-
            How many copies of it a merge rule gives it as backups, which play
            after those picked by hand (D113).
        merged_into:
          type: [string, "null"]
          description: The channel that a merge rule makes it a backup of, by its name in the lineup; null if none (D113).
        health:
          $ref: "#/components/schemas/ChannelHealth"
    RuleMatch:
      type: object
      additionalProperties: false
      description: >-
        The channels that a rule matches: those that meet everything given,
        every channel if nothing is. A pattern matches the whole text, whatever
        its case, with `*` for any characters and `?` for one; between
        slashes, such as `/^UK[: ]/`, it is a regular expression, which can
        match anywhere.
      properties:
        source_id:
          type: integer
          minimum: 1
          description: The channel's source. Removing the source removes the rule.
        group:
          type: string
          maxLength: 200
          description: A pattern for the channel's category in its source.
        name:
          type: string
          maxLength: 200
          description: A pattern for the channel's name in its source.
        guide:
          type: string
          maxLength: 200
          description: A pattern for the channel's guide ID.
        quality:
          type: string
          enum: [SD, HD, FHD, UHD, 4K, 8K, HEVC, H264, H265, 1080p, 720p, 50fps, 60fps]
          description: A word that the channel's name holds, whatever its case.
    RuleBody:
      type: object
      additionalProperties: false
      required: [action]
      description: >-
        A rule of a lineup (D107). Its fields other than `match`, `action` and
        `off` are those of its action; the others are left out.
      properties:
        match:
          $ref: "#/components/schemas/RuleMatch"
        action:
          $ref: "#/components/schemas/RuleAction"
        "off":
          type: boolean
          description: An off rule does nothing until it is on again.
        name:
          type: string
          maxLength: 200
          description: For `rename`, a new name.
        replace:
          type: string
          maxLength: 200
          description: >-
            For `rename`, in place of `name`, and for `guide`, in place of
            `channel`: text to replace in the name, whatever its case;
            between slashes, a regular expression.
        with:
          type: string
          maxLength: 200
          description: What replaces it, "" to take it out; `$1` and so on are a regular expression's groups.
        group:
          type: string
          maxLength: 100
          description: For `regroup`, the group's name; a group of that name is made if the lineup has none.
        from:
          type: integer
          minimum: 1
          maximum: 999999
          description: For `renumber`, the first number.
        logo:
          type: string
          format: uri
          maxLength: 2048
          description: For `logo`, the logo's address, http or https.
        channel:
          type: string
          maxLength: 200
          description: >-
            For `guide`, in place of `replace`: the name, as its source gives
            it, of the channel whose guide to show.
        minutes:
          type: integer
          minimum: -1440
          maximum: 1440
          description: For `timeshift`, how many minutes later the guide's times show, or earlier below 0; not 0.
        copies:
          type: string
          enum: [guide, name]
          description: >-
            For `merge`, what copies of a channel have the same: their guide
            ID, whatever its case, or their names, without quality words such
            as HD, case, marks and spaces, after `replace` is replaced by
            `with` if given.
        prefer:
          type: string
          enum: [SD, HD, FHD, UHD, 4K, 8K, HEVC, H264, H265, 1080p, 720p, 50fps, 60fps]
          description: For `merge`, a quality word whose copy shows first, before the lineup's order.
        sources:
          type: array
          maxItems: 20
          items:
            type: integer
          description: >-
            For `merge`, the IDs of the sources whose copies show first, in that order (D137), before
            the quality; a source removed leaves the order.
    RuleAction:
      type: string
      enum: [include, exclude, rename, regroup, renumber, logo, guide, timeshift, merge]
      description: >-
        `include` shows the channels, even in a hidden group; `exclude` hides
        them; `rename` names them anew or replaces text in their names, from
        the names that the rules before it gave; `regroup` moves them to a
        group; `renumber` numbers them in a row, in their order, keeping the
        numbers it gave before for the channels that it still matches and
        skipping numbers that the administrator pinned; `logo` gives them a
        logo; `guide` shows on them the guide of the lineup's channel named
        `channel`, or named as they are with `replace` replaced by `with`,
        from their own source if it has one (D108); `timeshift` moves the
        times of their guide's programmes by `minutes` (D108); `merge` finds
        the copies among them by `copies`, shows the first that devices see,
        of the `prefer` quality if one is given, else the first in the
        lineup, and hides the others, which play in its place in turn when
        its stream cannot start, after the backups picked by hand (D113).
        Where two rules do the same to a channel, the later one wins; what
        the administrator set on a channel wins over every rule.
    Rule:
      type: object
      required: [id, position, matches, match, action, "off"]
      properties:
        id:
          type: integer
        position:
          type: integer
          minimum: 1
          description: Its place among the lineup's rules, which run in this order.
        matches:
          type: integer
          description: How many of the lineup's channels it matches, whether it is on or off.
        copies_merged:
          type: integer
          description: For `merge`, how many copies it merges into other channels; left out when none.
        channels_merged:
          type: integer
          description: For `merge`, how many channels it merges copies into; left out when none.
        match:
          $ref: "#/components/schemas/RuleMatch"
        action:
          $ref: "#/components/schemas/RuleAction"
        "off":
          type: boolean
        name:
          type: string
        replace:
          type: string
        with:
          type: string
        group:
          type: string
        from:
          type: integer
        logo:
          type: string
        channel:
          type: string
        minutes:
          type: integer
        copies:
          type: string
          enum: [guide, name]
        prefer:
          type: string
        sources:
          type: array
          maxItems: 20
          items:
            type: integer
    Visibility:
      type: string
      enum: [group, shown, hidden]
      description: "`group`: shown unless its group is hidden; `shown`: shown even in a hidden group; `hidden`: hidden."
    OwnGuide:
      type: object
      description: >-
        A guide of the household's own (D139), without its address, and what
        its last read found.
      required: [id, name, host, address, user_agent, public_only, enabled, position, reading, read_at, read_error,
        listed, channels, programmes, fills, by_name, waiting]
      properties:
        id:
          type: integer
        name:
          type: string
        host:
          type: string
          description: Where its address points, or `file` and a file's name.
        address:
          type: string
          enum: [saved, locked]
          description: Whether its saved address can be read, or was saved with another key file and must be entered again.
        user_agent:
          type: string
          description: Sent when it is fetched; empty for Overscan's own.
        public_only:
          type: boolean
          description: Its requests go to public addresses only (D121).
        enabled:
          type: boolean
        position:
          type: integer
          description: Its place among the guides, from 1. Where two could fill a channel, the first does.
        reading:
          type: boolean
          description: Overscan is reading it now.
        read_at:
          type: [string, "null"]
          format: date-time
          description: When its last read ended, null if none has.
        read_error:
          type: string
          description: Why its last read failed, empty if it worked. It never quotes the address.
        listed:
          type: integer
          description: The channels that its last read listed.
        channels:
          type: integer
          description: Of those, the ones whose programmes it keeps, since they fill a channel.
        programmes:
          type: integer
        fills:
          type: integer
          description: The channels that it gives programmes to now.
        by_name:
          type: integer
          description: Of those, the ones that their names matched, rather than their guide IDs.
        waiting:
          type: integer
          description: Of those, the ones whose programmes its next read brings, since no channel used them at its last read.
    OwnGuideSettings:
      type: object
      description: What the administrator sets of a guide. What a change leaves out stays as it is.
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,31}$"
        address:
          type: string
          maxLength: 4096
          description: >-
            An http or https address of an XMLTV guide, gzip or not, or the
            absolute path of a guide's file on the server, which must be a
            regular file. It is kept encrypted and never sent back.
        user_agent:
          type: string
          maxLength: 200
        public_only:
          type: boolean
        enabled:
          type: boolean
        position:
          type: integer
          minimum: 1
          description: Where to move the guide among the guides; not taken when a guide is added.
    OwnGuideRead:
      type: object
      description: What a read of a guide found, or, with `reading` true, that it goes on.
      required: [reading, listed, fills, by_name, channels, programmes, skipped]
      properties:
        reading:
          type: boolean
        listed:
          type: integer
          description: The channels that the guide lists.
        fills:
          type: integer
          description: The channels that it gives programmes to.
        by_name:
          type: integer
          description: Of those, the ones that their names matched.
        channels:
          type: integer
          description: Of the guide's channels, the ones whose programmes it kept.
        programmes:
          type: integer
        skipped:
          type: integer
          description: Programmes and channels that it could not read, or that were too many.
    Source:
      type: object
      required: [id, name, type, host, address, enabled, max_connections, refresh_seconds, user_agent, numbers,
        new_categories_hidden, public_only, channels, refreshed_at, refresh_error, stream_limit, account, guide, films, series,
        categories]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [m3u, xtream, jellyfin, plex, folder, stalker]
          description: >-
            An M3U playlist, a server read through the Xtream API (D50), a
            Jellyfin server (D66) or a Plex server (D72), each read for its
            films and series only, a folder of films and series on the
            server (D67), or a Stalker portal, read as the box that the
            provider registered (D76).
        host:
          type: string
          description: >-
            Where the address points, its host and port, or for a file
            `file <name>`, or a folder's name. The address itself, an Xtream
            source's login, a Jellyfin source's API key and user, a Plex
            source's token and a Stalker portal's box and login are never
            shown.
          examples: [provider.example]
        address:
          type: string
          enum: [saved, missing, locked]
          description: >-
            `saved`: an address is saved and can be read; `missing`: none is
            saved; `locked`: it was saved with another key file and must be
            entered again (D46).
        enabled:
          type: boolean
        max_connections:
          type: integer
          description: How many streams the source allows at once; 0 for no limit.
        refresh_seconds:
          type: integer
          description: How often it is read; for a Jellyfin or a Plex source or a folder, how often Overscan checks that it can be read.
        user_agent:
          type: string
          description: The user agent it is read with; empty for Overscan's own.
        numbers:
          type: string
          enum: [playlist, provider]
          description: How its channels are numbered (D40).
        catchup_zone:
          type: string
          description: >-
            For an Xtream server or a playlist, the time zone of the dates and
            times in the addresses of its channels' archives (D81): an IANA name
            such as UTC or Europe/London, or empty for the one that an Xtream
            server gives, or else UTC.
        new_categories_hidden:
          type: boolean
          description: Whether the categories that it adds later start hidden in the lineup (D47).
        public_only:
          type: boolean
          description: >-
            Whether every request for the source may reach public addresses
            only (D121): none on the server's own networks. Always false for
            a folder.
        channels:
          type: integer
          description: The channels it lists now; 0 for a Jellyfin or a Plex source or a folder.
        refreshed_at:
          type: [string, "null"]
          format: date-time
        refresh_error:
          type: string
          description: Why the last read failed; empty if it worked.
        stream_limit:
          type: integer
          description: >-
            How many streams Overscan lets the source run at once:
            `max_connections`, or the account's limit where that is lower; 0
            for no limit.
        account:
          oneOf:
            - $ref: "#/components/schemas/Account"
            - type: "null"
          description: What an Xtream server or a Stalker portal last said about the account; null for other sources, and until one has said.
        guide:
          $ref: "#/components/schemas/Guide"
        films:
          oneOf:
            - $ref: "#/components/schemas/LibraryRead"
            - type: "null"
          description: >-
            What the reads of an Xtream, a Jellyfin or a Plex source's, a
            folder's or a Stalker portal's films did (D63); null for an M3U
            source. For a portal, `titles` counts the films read so far, a
            page at a time as devices browse them, and the read is of its
            categories (D77).
        series:
          oneOf:
            - $ref: "#/components/schemas/LibraryRead"
            - type: "null"
          description: >-
            What the reads of an Xtream, a Jellyfin or a Plex source's, a
            folder's or a Stalker portal's series did (D63); null for an M3U
            source. For a portal, as for its films.
        categories:
          type: object
          description: >-
            What the source brings of each kind of category that it has, by
            kind (D135): `live` for a source with live channels, `movies` and
            `series` for one with films and series; empty for a folder.
          additionalProperties:
            type: object
            required: [only_ticked, listed, ticked]
            properties:
              only_ticked:
                type: boolean
                description: It brings only the ticked categories; otherwise every one.
              listed:
                type: integer
                description: The categories that its reads listed.
              ticked:
                type: integer
                description: Of those, the ticked ones.
    SourceCategories:
      type: object
      required: [kind, only_ticked, tick_new, changed_at, read_at, pending, total, ticked, categories]
      description: What a source brings of a kind of category (D135).
      properties:
        kind:
          type: string
          enum: [live, movies, series]
        only_ticked:
          type: boolean
          description: It brings only the ticked categories; otherwise every one, as before.
        tick_new:
          type: boolean
          description: >-
            A category that it adds later starts ticked. While it brings every
            category, a new one starts ticked whatever this says.
        changed_at:
          type: [string, "null"]
          format: date-time
          description: When the choice, or a tick that counts, last changed; null if never.
        read_at:
          type: [string, "null"]
          format: date-time
          description: When a read of the kind last listed its categories; null if none has.
        pending:
          type: boolean
          description: The choice or a tick changed since that read, so the next read changes what it brings.
        total:
          type: integer
          description: The categories that match `q`, or every one, those past the list's end too.
        ticked:
          type: integer
          description: Of every category, the ticked ones.
        categories:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/SourceCategory"
    SourceCategory:
      type: object
      required: [key, name, items, ticked, listed_at]
      properties:
        key:
          type: string
          description: >-
            A live category's name, or the source's own ID for a category of
            films or series; empty for the channels or titles without one.
        name:
          type: string
          description: As the source names it; empty for the channels or titles without a category.
        items:
          type: [integer, "null"]
          description: >-
            The channels or titles that it held at the last read that listed
            it; null if that is not known, as for a Stalker portal's
            categories, whose titles are read a page at a time (D77).
        ticked:
          type: boolean
        listed_at:
          type: string
          format: date-time
          description: >-
            When a read last listed it. A category that no read lists for 7
            days is forgotten.
    SourceCategoriesChange:
      type: object
      additionalProperties: false
      description: What the body leaves out stays as it is.
      properties:
        only_ticked:
          type: boolean
        tick_new:
          type: boolean
        ticked:
          type: object
          description: >-
            Ticks by the categories' keys: true to tick, false to untick. The
            body must stay under 1 MiB; send more ticks in parts.
          additionalProperties:
            type: boolean
    CategoriesRead:
      type: object
      required: [reading]
      properties:
        reading:
          type: boolean
          description: A read of films or series goes on after the answer.
        channels:
          type: integer
          description: For live channels, those that the source brings.
        added:
          type: integer
        missing:
          type: integer
          description: For live channels, those that it stopped listing or bringing, kept for 7 days.
        removed:
          type: integer
        left_out:
          type: integer
          description: For live channels, those that it listed in categories that it does not bring.
    LibraryRead:
      type: object
      required: [read_at, tried_at, error, titles]
      description: >-
        What the reads of a source's films, or of its series, did. Overscan
        reads them when a box first asks for them, and again a day later at
        the soonest, when a box asks (D63).
      properties:
        read_at:
          type: [string, "null"]
          format: date-time
          description: When the last read that worked ended; null if none has.
        tried_at:
          type: [string, "null"]
          format: date-time
          description: When the last read ended, whether it worked or not; null if none has.
        error:
          type: string
          description: Why the last read failed; empty if it worked. A failed read keeps what was read before.
        titles:
          type: integer
          description: The films or series that the last read that worked listed.
    Guide:
      type: object
      required: [listed, read_at, error, channels, programmes]
      description: >-
        What the last read of the source's guide found (D51). An Xtream
        source's guide is its server's `xmltv.php`; a playlist's is the one
        it names in `url-tvg`.
      properties:
        listed:
          type: boolean
          description: The source's playlist names a guide.
        read_at:
          type: [string, "null"]
          format: date-time
          description: When the last read ended; null if none has.
        error:
          type: string
          description: Why the last read failed; empty if it worked. A failed read keeps the guide as it was.
        channels:
          type: integer
          description: The source's channels that the guide gives programmes for.
        programmes:
          type: integer
    Account:
      type: object
      required: [status, expires_at, max_connections, time_zone]
      properties:
        status:
          type: string
          description: As the server gives it; an account plays only when it is `Active`.
          examples: [Active, Expired]
        expires_at:
          type: [string, "null"]
          format: date-time
          description: When the account runs out; null if it does not.
        max_connections:
          type: integer
          description: How many streams the account may run at once; 0 if the server does not say.
        time_zone:
          type: string
          description: The server's IANA time zone; empty if it gives none.
    Stream:
      type: object
      required: [id, kind, device_id, device, entry_id, item_id, channel, source_id, source, started_at, bytes, hls, playing, details]
      properties:
        id:
          type: string
          description: Names the stream, to stop it with `POST /streams/{id}/stop` (D138).
        kind:
          type: string
          enum: [live, movie, episode, archive]
          description: What plays, a channel, a film, an episode of a series, or a past programme of a channel from its source's archive (D81).
        device_id:
          type: integer
        account_id:
          type: integer
          description: The account of the device, or of the box that asked for a recording; 0 for none (D102).
        device:
          type: string
          description: The device's label, or else its MAC address.
        entry_id:
          type: integer
          description: The channel's lineup entry, for a channel or its past programme; 0 for a film or an episode.
        item_id:
          type: integer
          description: The film's or the episode's ID; 0 for a channel.
        channel:
          type: string
          description: The channel's name, as devices see it, or the film's, or the series' with the season and episode, such as "Coastline S1 E2".
        source_id:
          type: integer
        source:
          type: string
        started_at:
          type: string
          format: date-time
        bytes:
          type: integer
          description: What the hub has sent the player so far.
        hls:
          type: boolean
          description: The source sends HLS.
        repaired:
          type: boolean
          description: A channel's stream goes through ffmpeg to be repaired (D57).
        converted:
          type: boolean
          description: >-
            A film or an episode goes through ffmpeg, which converts what the
            box cannot play (D68).
        transcoded:
          type: boolean
          description: >-
            A film or an episode whose picture the box cannot play, which its
            source's server (D71) or this server's ffmpeg (D73) transcodes.
        transcoded_by:
          type: string
          enum: [source, overscan]
          description: >-
            Who transcodes it: its source's server, or this server's ffmpeg.
            Left out when it is not transcoded.
        playing:
          type: boolean
          description: A player is fetching it now; otherwise the session waits for one to come back.
        timeshift:
          type: boolean
          description: >-
            A box's channel that plays through a timeshift buffer, so that
            the box can pause it and go back (D92). Left out otherwise.
        shared:
          type: boolean
          description: >-
            A channel that plays from a shared tuner, whose one connection
            to the source serves every screen that plays it (D93); `bytes`
            is then what the tuner has taken from the source. Left out
            otherwise.
        programme:
          type: string
          description: For a past programme, its title, where the guide still has it.
        aired_at:
          type: string
          format: date-time
          description: For a past programme, when it began.
        details:
          type: string
          description: >-
            What a channel's stream holds, as the hub read it passing through,
            such as "1080i H.264, AC-3" or "2160p HEVC HDR10, AAC" (D138);
            empty until known, and for a film or an episode.
    ChannelHealth:
      type: object
      required: [failed_at, failures, played_at, hidden_until_played, stream]
      description: What Overscan has seen of a channel's stream as people watched (D138).
      properties:
        failed_at:
          type: [string, "null"]
          format: date-time
          description: When its stream last failed to start; null if never.
        failures:
          type: integer
          description: How many times in a row it failed to start; 0 once it plays.
        played_at:
          type: [string, "null"]
          format: date-time
          description: When its stream last started; null if not seen.
        hidden_until_played:
          type: boolean
          description: Devices do not see it until its stream plays again.
        stream:
          oneOf:
            - $ref: "#/components/schemas/StreamDetails"
            - type: "null"
          description: What its stream held when last read; null if never read.
    StreamDetails:
      type: object
      required: [video, width, height, interlaced, bit_depth, frame_rate, dynamic_range, audio, summary, seen_at]
      description: >-
        What the hub read of a channel's stream from its first megabytes, in
        Go, as it passed: the video's parameters and the audio's codecs. Empty
        strings and zeros for what it could not read.
      properties:
        video:
          type: string
          description: The video's codec, such as "H.264", "HEVC" or "MPEG-2".
        width:
          type: integer
        height:
          type: integer
        interlaced:
          type: boolean
        bit_depth:
          type: integer
        frame_rate:
          type: number
          description: Frames a second.
        dynamic_range:
          type: string
          enum: ["", SDR, HDR10, HLG]
        audio:
          type: array
          items:
            type: string
          description: Each audio track's codec, such as "AAC" or "AC-3".
        summary:
          type: string
          description: All of it in a few words, such as "1080i H.264, AC-3".
        seen_at:
          type: string
          format: date-time
    FailedChannel:
      allOf:
        - type: object
          required: [channel_id, name, source_id, source]
          properties:
            channel_id:
              type: integer
            name:
              type: string
              description: The channel's name, as its source gives it.
            source_id:
              type: integer
            source:
              type: string
        - $ref: "#/components/schemas/ChannelHealth"
    HoldChannels:
      type: object
      additionalProperties: false
      required: [hidden_until_played]
      properties:
        hidden_until_played:
          type: boolean
    Recording:
      type: object
      required: [id, device_id, entry_id, channel, title, start, stop, state, bytes]
      properties:
        id:
          type: integer
        device_id:
          type: integer
          description: The box that scheduled it.
        entry_id:
          type: integer
          description: The lineup entry it records.
        channel:
          type: string
          description: The channel's name, as the box saw it.
        title:
          type: string
          description: >-
            The programme's, from the guide; for a channel recorded with no
            programme in the guide, the channel's name.
        start:
          type: string
          format: date-time
          description: >-
            When the programme begins, and the recording a minute earlier;
            for a channel recorded from now on (D98), when it began; for one
            set by time (D101), when it begins.
        stop:
          type: string
          format: date-time
          description: >-
            When the programme ends, and the recording two minutes later;
            for one that runs until it is stopped, the latest it may run;
            for one set by time, when it ends.
        until_stopped:
          type: boolean
          description: Present, and true, for a recording that runs until it is stopped (D98).
        timed:
          type: boolean
          description: Present, and true, for a recording that a box set by time, from its start to its stop exactly (D101).
        state:
          type: string
          enum: [scheduled, recording, done, failed, cancelled]
        file:
          type: string
          description: Its file's name in the recordings folder, once there is one.
        bytes:
          type: integer
        error:
          type: string
          description: Why it failed, as a sentence.
    Capture:
      type: object
      required: [module, action, params, example, user_agent, device_id, count, first_seen, last_seen]
      properties:
        module:
          type: string
          description: The request's `type` parameter.
          examples: [itv]
        action:
          type: string
          examples: [set_fav]
        params:
          type: array
          items:
            type: string
          description: The request's parameter names, sorted.
        example:
          type: string
          description: The last such request's query, with credentials and tokens taken out.
        user_agent:
          type: string
        device_id:
          type: [integer, "null"]
          description: The device that last asked, if known.
        count:
          type: integer
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
    SourceSettings:
      type: object
      additionalProperties: false
      description: A source's settings. A change leaves out what stays as it is.
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,31}$"
        type:
          type: string
          enum: [m3u, xtream, jellyfin, plex, folder, stalker]
          description: m3u when left out of a new source.
        url:
          type: string
          maxLength: 4096
          description: >-
            For an M3U source, an http or https address, or the absolute path
            of a playlist file on the server. For an Xtream, a Jellyfin or a
            Plex source, the server's address, without a page, such as
            `http://provider.example:8080`. For a Stalker portal, the
            portal's address as the provider gave it, such as
            `http://portal.example/c/`. For a folder, its absolute path on
            the server. It can hold credentials, so it is stored encrypted
            and never sent back.
        username:
          type: string
          maxLength: 256
          description: >-
            An Xtream source's username, stored encrypted and never sent back.
            A change of an Xtream source can give only some of `url`,
            `username` and `password`; the rest stays as saved. A source that
            changes its type needs all of them. For a Jellyfin source, the
            user whose libraries boxes see, or empty for every library;
            stored encrypted, and left out of a change, the saved one stays.
            For a Stalker portal, the login that the portal asks for, if it
            asks for one. A Plex source has none.
        password:
          type: string
          maxLength: 256
          description: >-
            An Xtream source's password, a Jellyfin source's API key, or a
            Plex source's token (the X-Plex-Token of an account that sees the
            libraries), or the password of a Stalker portal's login, stored
            encrypted and never sent back. A change of a Jellyfin or a Plex
            source can give `url` or `password` alone; the other stays as
            saved.
        mac:
          type: string
          pattern: "^[0-9A-Fa-f]{2}([:-][0-9A-Fa-f]{2}){5}$"
          description: >-
            A Stalker portal's box: the MAC address that the provider
            registered (D76), which Overscan signs in with and never varies.
            Stored encrypted with the box's other details and never sent
            back. A new portal, or a source that becomes one, needs it with
            `url`. A change that gives it describes the box again: the other
            details that it leaves out are none. A change without it keeps
            each detail that it leaves out, and the address and login too.
        serial:
          type: string
          maxLength: 256
          description: A Stalker portal's box's serial number, if the provider checks it.
        device_id:
          type: string
          maxLength: 256
          description: A Stalker portal's box's device ID, if the provider checks it.
        device_id2:
          type: string
          maxLength: 256
          description: A Stalker portal's box's second device ID, if the provider checks it.
        signature:
          type: string
          maxLength: 256
          description: A Stalker portal's box's signature, if the provider checks it.
        model:
          type: string
          maxLength: 32
          description: The model that a Stalker portal's box says it is; MAG250 when empty.
        user_agent:
          type: string
          maxLength: 200
        max_connections:
          type: integer
          minimum: 0
          maximum: 1000
          description: Left out of a new source, 1, or 0 (no limit) for a Jellyfin or a Plex source or a folder.
        refresh_seconds:
          type: integer
          minimum: 900
          maximum: 604800
        numbers:
          type: string
          enum: [playlist, provider]
        catchup_zone:
          type: string
          maxLength: 64
          description: >-
            For an Xtream server or a playlist only: the time zone of the dates
            and times in its catch-up addresses, an IANA name such as UTC or
            Europe/London, or empty for the server's own (D81).
        enabled:
          type: boolean
        new_categories_hidden:
          type: boolean
        public_only:
          type: boolean
          description: >-
            Keep every request for the source to public addresses (D121);
            ignored for a folder.
        bring:
          type: string
          enum: [every, ticked]
          description: >-
            For a new source only: what it brings (D135). `every` category,
            as before, when left out; or only those `ticked`, of each kind of
            category that it has, once its first read lists them, which keeps
            its categories alone. A folder ignores it. A source that exists
            changes it with `PUT sources/{id}/categories/{kind}`; a change
            that gives it is refused.
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: A code for scripts.
          examples: [unauthenticated]
        message:
          type: string
          description: A sentence for people.

  responses:
    NoSuchLineup:
      description: There is no such lineup (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Backups:
      description: The channel's backups, in the order the hub tries them.
      content:
        application/json:
          schema:
            type: object
            required: [backups]
            properties:
              backups:
                type: array
                items:
                  type: object
                  required: [entry_id, channel_id, name, source, number, missing]
                  properties:
                    entry_id:
                      type: integer
                      description: The backup's own channel in the lineup.
                    channel_id:
                      type: integer
                    name:
                      type: string
                      description: As devices see it.
                    source:
                      type: string
                    number:
                      type: [integer, "null"]
                    missing:
                      type: boolean
                      description: Its source no longer lists it, so it is passed over.
    Rule:
      description: The rule.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Rule"
    RuleMistake:
      description: >-
        The rule cannot be saved (`bad_rule`, with what is wrong), a place is
        not one (`bad_position`), or the body is not the JSON the path takes
        (`bad_json`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRules:
      description: The lineup has as many rules as it may, 200 (`too_many_rules`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LineupConflict:
      description: >-
        Another lineup has that name (`name_taken`), an account sees the lineup (`lineup_in_use`), or the server
        has as many lineups as it may (`too_many_lineups`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Device:
      description: The device.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Device"
    DeviceMistake:
      description: >-
        The request cannot be done: the MAC address (`bad_mac`), the code
        (`bad_code`), the label (`bad_label`) or the account (`no_account`)
        is not valid, or the body is not the JSON the path takes
        (`bad_json`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Group:
      description: The group.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Group"
    Shelves:
      description: The shelves, hidden ones too, in the order devices see them in.
      content:
        application/json:
          schema:
            type: object
            required: [shelves]
            properties:
              shelves:
                type: array
                items:
                  $ref: "#/components/schemas/Shelf"
    Settings:
      description: Settings for the whole server.
      content:
        application/json:
          schema:
            type: object
            required: [repair_default, repair_hls, transcode_video, convert_sound, server_transcodes, adult_marks, radio_apart, tmdb_key_set, tmdb_language, recordings_cap, recordings_until, recordings_max_hours, timeshift_minutes, shared_tuner, outputs, outputs_anywhere]
            properties:
              repair_default:
                type: boolean
                description: >-
                  Channels are repaired unless their own switch says otherwise
                  (D58). Off at first.
              repair_hls:
                type: boolean
                description: >-
                  A repaired channel whose address is HLS comes to devices as
                  one continuous stream that the server makes from it, so that
                  it can be repaired (D61). Off at first.
              transcode_video:
                type: integer
                minimum: 0
                maximum: 3
                description: >-
                  How many films and episodes at a time this server's ffmpeg
                  may transcode whose video a box cannot play, from a source
                  whose server does not transcode (D73). 0, at first, for none.
              convert_sound:
                type: boolean
                description: >-
                  A film or an episode whose sound or file a box cannot play
                  goes through ffmpeg, which copies its picture and converts
                  its sound (D68, D78); off, it goes as it is. On at first.
              server_transcodes:
                type: boolean
                description: >-
                  A film or an episode whose video a box cannot play, from a
                  source whose server transcodes, such as Jellyfin, goes
                  through that server (D71, D78); off, it goes as it is. On at
                  first.
              adult_marks:
                type: string
                enum: [nothing, lock, hide]
                description: >-
                  What the marks that sources put on channels, films and series
                  for adults do (D86, D91): lock them, as if the administrator
                  had, at first; nothing; or hide them from every device.
              radio_apart:
                type: boolean
                description: >-
                  Boxes show radio stations on their Radio screen alone, and not
                  among the channels of Live TV and the guide (D87). Off at
                  first: they show in both.
              tmdb_key_set:
                type: boolean
                description: >-
                  The administrator gave a key for TMDB, with which the films
                  and series in folders get what their folders lack (D88).
              tmdb_language:
                type: string
                description: The language TMDB is asked in, such as en-GB; "" for TMDB's own.
              recordings_cap:
                type: integer
                minimum: 0
                maximum: 4000
                description: >-
                  The room that recordings may take, in gigabytes (D89). 0, at
                  first, for none: boxes cannot record.
              recordings_until:
                type: string
                enum: [programme, stopped]
                description: >-
                  What a recording that a box starts on a channel runs until,
                  while the guide shows a programme on it: "programme", at
                  first, for its end, or "stopped", until it is stopped (D98).
                  Without a programme, it runs until it is stopped.
              recordings_max_hours:
                type: integer
                minimum: 1
                maximum: 24
                description: >-
                  The most hours that a recording which runs until it is
                  stopped may run (D98); 4 at first.
              timeshift_minutes:
                type: integer
                minimum: 0
                maximum: 240
                description: >-
                  How many minutes of the channel a box watches the server
                  keeps, so that the box can pause live TV and go back in it
                  (D92). 0, at first, for none.
              shared_tuner:
                type: boolean
                description: >-
                  One connection to a source serves every screen that plays a
                  channel, and counts once against the source's limit (D93).
                  Off at first: each screen has a connection of its own.
              outputs:
                type: boolean
                description: >-
                  The outputs that players other than the boxes use (D103,
                  D104). Off at first.
              outputs_anywhere:
                type: boolean
                description: >-
                  The outputs answer players from any address. Off at first:
                  only private, loopback, link-local and shared (RFC 6598)
                  addresses.
    NoRecorder:
      description: This server cannot record (`no_recorder`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PIN:
      description: Whether the household has a parental PIN.
      content:
        application/json:
          schema:
            type: object
            required: [set]
            properties:
              set:
                type: boolean
    OwnGuide:
      description: The guide.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OwnGuide"
    OwnGuideMistake:
      description: >-
        A setting breaks a rule: `bad_name`, `bad_address`, `bad_user_agent`
        or `bad_position`; or the body is not the JSON the path takes
        (`bad_json`). The message never quotes the address.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OwnGuideConflict:
      description: >-
        Another guide has the name (`name_taken`), the server keeps as many
        guides as it can (`too_many`), or the guide's address was saved with
        another key file (`address_locked`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OwnGuideFailed:
      description: >-
        The guide could not be read (`guide_failed`): the message says why,
        without the address.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Source:
      description: The source.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Source"
    Tested:
      description: What the test found. Nothing was stored.
      content:
        application/json:
          schema:
            type: object
            required: [channels, skipped, account, server, libraries, folder]
            properties:
              channels:
                type: integer
                description: The channels it lists.
              skipped:
                type: integer
                description: Entries that would be left out, such as movies, series and unusable addresses or IDs.
              account:
                oneOf:
                  - $ref: "#/components/schemas/Account"
                  - type: "null"
                description: What an Xtream server or a Stalker portal says about the account; null for other sources.
              server:
                oneOf:
                  - type: object
                    required: [name, version]
                    properties:
                      name:
                        type: string
                        description: The server's name, as its owner set it.
                      version:
                        type: string
                        examples: [10.11.2]
                  - type: "null"
                description: What a Jellyfin or a Plex server says about itself; null for other sources.
              libraries:
                type: [array, "null"]
                items:
                  type: string
                description: >-
                  The names of a Jellyfin or a Plex server's libraries whose
                  films and series boxes would see; null for other sources.
              folder:
                oneOf:
                  - type: object
                    required: [name, films, series]
                    properties:
                      name:
                        type: string
                        description: The folder's name, the last part of its path.
                      films:
                        type: integer
                      series:
                        type: integer
                  - type: "null"
                description: What a folder holds; null for other sources.
    SourceMistake:
      description: >-
        A setting breaks a rule: `bad_name`, `bad_type`, `bad_url`,
        `bad_username`, `bad_password`, `bad_mac`, `bad_device`,
        `bad_user_agent`, `bad_max_connections`, `bad_refresh`,
        `bad_numbers` or `bad_bring`; or the body is not the JSON the path takes
        (`bad_json`). The message never quotes the address, the login or
        the box's details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SourceConflict:
      description: >-
        Another source has the name (`name_taken`), the source has no address
        saved (`no_address`), its address was saved with another key file
        (`address_locked`), or it is off and cannot be read (`source_off`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SourceFailed:
      description: >-
        The source could not be read (`source_failed`): the message says why,
        without the address.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SourceCategories:
      description: What the source brings of the kind of category, and its categories.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SourceCategories"
    Renamed:
      description: What was renamed; nothing if no name held the text.
      content:
        application/json:
          schema:
            type: object
            required: [renamed]
            properties:
              renamed:
                type: array
                items:
                  type: object
                  required: [id, from, to]
                  properties:
                    id:
                      type: integer
                    from:
                      type: string
                    to:
                      type: string
    EditMistake:
      description: >-
        The change cannot be made: a name (`bad_name`), a number
        (`bad_number`) or a visibility (`bad_visibility`) is not valid, no
        channels were given (`no_channels`), a name or number was given for
        several channels (`one_at_a_time`), or the body is not the JSON the
        path takes (`bad_json`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EditConflict:
      description: Another group has the name (`name_taken`), or the group is not empty (`group_not_empty`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: There is no such item (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Expiry:
      description: When the household's account ends, and whether it has.
      content:
        application/json:
          schema:
            type: object
            required: [expires_at, ended]
            properties:
              expires_at:
                type: [string, "null"]
                format: date-time
                description: When it ends; null if never.
              ended:
                type: boolean
    NoSuchDevice:
      description: There is no device with that MAC address (`no_such_device`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Theme:
      description: The theme.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Theme"
    NoSuchTheme:
      description: There is no such theme (`no_such_theme`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Profile:
      description: The profile.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Profile"
    OverscanAccount:
      description: The account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OverscanAccount"
    AccountMistake:
      description: >-
        A name, username, password, PIN, date, limit or sources that the
        account cannot have (`bad_name`, `bad_username`, `bad_password`,
        `password_in_use`, `bad_pin`, `bad_date`, `bad_streams`,
        `bad_sources`), or a body that is not the JSON the path takes
        (`bad_json`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountConflict:
      description: >-
        There are 50 accounts, the most there may be (`too_many_accounts`);
        the account is the household's (`household`) or has devices
        (`has_devices`); another account has the username
        (`username_taken`); or the server has no key file (`no_key`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoSuchAccount:
      description: There is no such account (`no_such_account`), or it has no playlist token (`no_token`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProfileMistake:
      description: >-
        The name is empty, longer than 32 characters, holds a control
        character or is another profile's (`bad_name`), the PIN is not four
        to eight digits (`bad_pin`), or the body is not the JSON the path
        takes (`bad_json`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProfileConflict:
      description: >-
        The household has 12 profiles, the most it may (`too_many_profiles`),
        or the profile is its only one (`last_profile`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoSuchProfile:
      description: The household has no such profile (`no_such_profile`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The body is not the JSON this path takes (`bad_json`), or it is too large (`too_large`, with status 413).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotJSON:
      description: The body is not sent as `application/json` (`not_json`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: There is no valid session (`unauthenticated`); sign in with `POST /session`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CSRF:
      description: >-
        The request lacks the session's CSRF token in `X-CSRF-Token` (`csrf`),
        or it came from another origin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyFailures:
      description: Too many failed sign-ins (`too_many_failures`); try again after `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds until a sign-in may be tried again.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

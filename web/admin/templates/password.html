{{define "content"}}
<p class="crumbs"><a href="/admin/settings">Settings</a></p>
<div class="page-head">
  <div>
    <h1>Password</h1>
    <p class="lead">The administrator's password, for signing in to this admin.</p>
  </div>
</div>
<section class="card narrow">
  {{template "alerts" .}}
  <form method="post" action="/admin/password" class="stack">
    <input type="hidden" name="csrf" value="{{.Session.CSRFToken}}">
    <input type="text" name="username" autocomplete="username" value="{{.Session.Username}}" hidden>
    <label for="current">Current password</label>
    <input id="current" name="current" type="password" autocomplete="current-password" required>
    <label for="new">New password</label>
    <input id="new" name="new" type="password" autocomplete="new-password" minlength="8" required>
    <label for="again">New password, again</label>
    <input id="again" name="again" type="password" autocomplete="new-password" minlength="8" required>
    <p class="hint">At least 8 characters. A new password signs out every other session.</p>
    <button type="submit" class="primary">Change the password</button>
  </form>
</section>
{{end}}

# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Runs the soak test (tools/soak, docs/testing.md): Overscan with a lineup
# of 20,000 channels and their guide, a folder of films and series, a guide
# of the household's own with a week of programmes for 20,000 channels,
# hour-long placeholder programmes and a read of the XMLTV guide, and four
# simulated boxes that watch channels, switch between them and browse the
# films, checked against the memory budgets of the plan (section 15). It
# runs for ten minutes every Monday, and on demand for as long as asked, up
# to five and a half hours, since a job of GitHub's stops at six; not on
# every pull request.
name: Soak

on:
  workflow_dispatch:
    inputs:
      duration:
        description: How long the boxes run, such as 10m or 5h; at most 330m
        required: false
        default: 10m
        type: string
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: soak
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    # Six hours for a run asked for by hand, which may be long; the weekly
    # run's ten minutes need far less.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 40 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Soak test
        env:
          DURATION: ${{ inputs.duration || '10m' }}
        run: |
          if ! [[ "$DURATION" =~ ^([0-9]+)([mh])$ ]]; then
            echo "::error::'$DURATION' is not a duration such as 10m or 2h"
            exit 1
          fi
          minutes=${BASH_REMATCH[1]}
          if [ "${BASH_REMATCH[2]}" = h ]; then
            minutes=$((minutes * 60))
          fi
          if [ "$minutes" -gt 330 ]; then
            echo "::error::'$DURATION' is longer than 330 minutes, which a job of six hours cannot hold with the build and the setting up"
            exit 1
          fi
          go run ./tools/soak -duration "$DURATION" -own-guide 20000 -own-hours 168 -placeholders 60 -out soak.csv

      - name: Keep the samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-samples
          path: soak.csv
          if-no-files-found: ignore
          retention-days: 30

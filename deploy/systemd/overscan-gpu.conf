#
# A drop-in for overscan.service that lets it reach the server's graphics,
# for ffmpeg to transcode on them through VA-API (D148, D149). The unit's
# PrivateDevices= hides every physical device; this gives the service the
# graphics' devices, and the group that owns their render devices, and
# nothing more: other devices stay closed to it, as the unit's other
# settings stay as they are.
#
# install.sh --gpu installs it as
# /etc/systemd/system/overscan.service.d/gpu.conf, and --no-gpu removes it.
# With the Debian package, docs/transcoding.md says how.
[Service]
PrivateDevices=no
DevicePolicy=closed
DeviceAllow=char-drm rw
SupplementaryGroups=render
